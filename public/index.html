// RNG
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return (h^h>>>16)>>>0}}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296}}
function seeded(seed){return mulberry32(xmur3(String(seed))())}
function shuffle(arr,rng){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomSeed(){return String(Math.floor(100000+Math.random()*900000))}

function poomsaeRoundNames(n){if(n<=8)return ['RONDA ÚNICA'];if(n<=16)return ['SEMIFINAL','FINAL'];return ['PRELIMINAR 1','PRELIMINAR 2','PRELIMINAR 3','SEMIFINAL','FINAL']}
function drawPoomsaes(cat,n,rng){if((cat.poomsaes||[]).length<2)throw new Error('La categoría necesita al menos 2 poomsaes disponibles.');return poomsaeRoundNames(n).map(name=>{const p=shuffle(cat.poomsaes,rng).slice(0,2);return {name,poomsaes:p}})}
function nextPow2(n){let p=1;while(p<n)p*=2;return p}
function roundLabels(size){const r=Math.log2(size),labs=[];for(let i=0;i<r;i++){const remaining=r-i;if(remaining===1)labs.push('Final');else if(remaining===2)labs.push('Semifinal');else if(remaining===3)labs.push('Cuartos');else if(remaining===4)labs.push('Octavos');else if(remaining===5)labs.push('Dieciseisavos');else labs.push('Ronda '+(i+1))}return labs}
function meetRoundForSlots(a,b,size){let block=2,round=1;while(block<=size){if(Math.floor(a/block)===Math.floor(b/block))return round;block*=2;round++}return Math.log2(size)}
function clubFeasibility(entries){const c={};entries.forEach(e=>c[e.clubId]=(c[e.clubId]||0)+1);const max=Math.max(0,...Object.values(c));return {possible:max<=2,max,counts:c}}
function evaluatePlacement(slots,size){const byClub={};slots.forEach((e,i)=>{if(e){(byClub[e.clubId]??=[]).push({e,i})}});const finalRound=Math.log2(size);let penalty=0;const violations=[];for(const [club,items] of Object.entries(byClub)){for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){const round=meetRoundForSlots(items[i].i,items[j].i,size);if(round<finalRound){penalty+=(finalRound-round)*100+1;violations.push({clubId:club,a:items[i].e.id,b:items[j].e.id,round,roundName:roundLabels(size)[round-1]})}}}return {penalty,violations}}
function placeStrict(entries,size,rng){const half=size/2;const left=[...Array(half).keys()],right=[...Array(half).keys()].map(i=>i+half);const slots=Array(size).fill(null);const groups={};entries.forEach(e=>(groups[e.clubId]??=[]).push(e));const pairs=[],singles=[];Object.values(groups).forEach(g=>g.length===2?pairs.push(shuffle(g,rng)):singles.push(...g));let L=shuffle(left,rng),R=shuffle(right,rng);pairs.forEach(g=>{slots[L.pop()]=g[0];slots[R.pop()]=g[1]});const rem=shuffle([...L,...R],rng);shuffle(singles,rng).forEach(e=>slots[rem.pop()]=e);return slots}
function placeBestEffort(entries,size,rng){let best=null;const positions=[...Array(size).keys()];for(let attempt=0;attempt<600;attempt++){const s=Array(size).fill(null);const shuffled=shuffle(entries,rng);const pos=shuffle(positions,rng);shuffled.forEach((e,i)=>s[pos[i]]=e);const ev=evaluatePlacement(s,size);if(!best||ev.penalty<best.ev.penalty){best={slots:s,ev};if(ev.penalty===0)break}}return best}
function buildBracket(entries,rng,forceBest=false){const size=nextPow2(Math.max(2,entries.length));const feas=clubFeasibility(entries);let slots,evalp;if(feas.possible&&!forceBest){slots=placeStrict(entries,size,rng);evalp=evaluatePlacement(slots,size)}else{const b=placeBestEffort(entries,size,rng);slots=b.slots;evalp=b.ev}
  const labels=roundLabels(size), rounds=[];let matches=[];for(let i=0;i<size;i+=2){matches.push({id:uid('m'),p1:slots[i]?.id||null,p2:slots[i+1]?.id||null,winnerId:null,source1:null,source2:null})}rounds.push({name:labels[0],matches});
  for(let r=1;r<labels.length;r++){const prev=rounds[r-1].matches;const mm=[];for(let i=0;i<prev.length;i+=2)mm.push({id:uid('m'),p1:null,p2:null,winnerId:null,source1:prev[i].id,source2:prev[i+1].id});rounds.push({name:labels[r],matches:mm})}
  const bracket={size,rounds,validation:{possible:feas.possible,valid:evalp.violations.length===0,violations:evalp.violations,counts:feas.counts}};autoAdvanceByes(bracket);return bracket}
function findMatch(bracket,id){for(const [ri,r] of bracket.rounds.entries()){const mi=r.matches.findIndex(m=>m.id===id);if(mi>=0)return {match:r.matches[mi],ri,mi}}return null}
function setNextSlot(bracket,ri,mi,winnerId){if(ri>=bracket.rounds.length-1)return;const next=bracket.rounds[ri+1].matches[Math.floor(mi/2)];if(mi%2===0)next.p1=winnerId;else next.p2=winnerId}
function branchHasPotential(bracket,sourceId){if(!sourceId)return false;const f=findMatch(bracket,sourceId);if(!f)return false;const m=f.match;if(m.p1||m.p2||m.winnerId)return true;return branchHasPotential(bracket,m.source1)||branchHasPotential(bracket,m.source2)}
function slotCanStillProduce(bracket,m,side,ri){if(ri===0)return side===1?!!m.p1:!!m.p2;const source=side===1?m.source1:m.source2;return branchHasPotential(bracket,source)}
function autoAdvanceByes(bracket){for(let ri=0;ri<bracket.rounds.length;ri++){for(let mi=0;mi<bracket.rounds[ri].matches.length;mi++){const m=bracket.rounds[ri].matches[mi];if(m.winnerId)continue;const p1Potential=m.p1||slotCanStillProduce(bracket,m,1,ri),p2Potential=m.p2||slotCanStillProduce(bracket,m,2,ri);if(m.p1&&!p2Potential){m.winnerId=m.p1;setNextSlot(bracket,ri,mi,m.p1)}else if(m.p2&&!p1Potential){m.winnerId=m.p2;setNextSlot(bracket,ri,mi,m.p2)}}}}
function clearDownstream(bracket,ri,mi){if(ri>=bracket.rounds.length-1)return;const next=bracket.rounds[ri+1].matches[Math.floor(mi/2)];const old=next.winnerId;next.winnerId=null;if(mi%2===0)next.p1=null;else next.p2=null;if(old)clearDownstream(bracket,ri+1,Math.floor(mi/2))}
function selectWinner(catId,ri,mi,winnerId){const d=state.currentDraws[catId];if(!d||d.system!=='ELIMINATORIA')return;const m=d.bracket.rounds[ri].matches[mi];if(![m.p1,m.p2].includes(winnerId))return;m.winnerId=winnerId;clearDownstream(d.bracket,ri,mi);setNextSlot(d.bracket,ri,mi,winnerId);autoAdvanceByes(d.bracket);d.updatedAt=Date.now();computeBracketResult(d);save();renderCompetition()}
function undoWinner(catId,ri,mi){const d=state.currentDraws[catId],m=d.bracket.rounds[ri].matches[mi];if(!m.winnerId)return;m.winnerId=null;clearDownstream(d.bracket,ri,mi);d.result=null;save();renderCompetition()}
function computeBracketResult(d){const last=d.bracket.rounds.at(-1).matches[0];if(!last?.winnerId)return;const runner=last.p1===last.winnerId?last.p2:last.p1;if(!runner)return;d.result={championId:last.winnerId,runnerUpId:runner,thirdId:d.result?.thirdId||null,completedAt:Date.now()}}

function makeDraw(cat,manualSeed=null,forceBest=false){const es=entriesFor(cat.id);if(!es.length)throw new Error('No hay participantes inscritos en esta categoría.');const seed=String(manualSeed||randomSeed());const signature=[seed,cat.id,cat.system,cat.poomsaes.join('|'),...es.map(e=>[e.id,e.clubId,entryName(e)].join(':')).sort()].join('||');const rng=seeded(signature);const poomsaeRounds=drawPoomsaes(cat,es.length,rng);let order=null,bracket=null;if(cat.system==='ORDEN'){order=shuffle(es,rng).map((e,i)=>({position:i+1,entryId:e.id}))}else bracket=buildBracket(es,rng,forceBest);
  const draw={id:uid('draw'),categoryId:cat.id,categoryName:cat.name,type:cat.type,sex:cat.sex,age:cat.age,system:cat.system,entryCount:es.length,clubCount:new Set(es.map(e=>e.clubId)).size,seed,createdAt:Date.now(),confirmed:false,poomsaesAvailable:[...cat.poomsaes],poomsaeRounds,participants:es.map(e=>({...deep(e),clubName:clubName(e)})),order,bracket,result:null,signature};
  state.currentDraws[cat.id]=draw;state.history.unshift(deep(draw));save();return draw}
function confirmDraw(catId){const d=state.currentDraws[catId];if(!d)return;if(d.confirmed)return toast('El sorteo ya está confirmado.');if(confirm('¿Confirmar y bloquear este sorteo? Después habrá que desbloquearlo para volver a sortear.')){d.confirmed=true;d.confirmedAt=Date.now();save();renderDraws();toast('Sorteo confirmado y bloqueado.')}}
function unlockDraw(catId){const d=state.currentDraws[catId];if(!d?.confirmed)return;if(confirm('Al desbloquear este sorteo se permitirá generar un resultado diferente. ¿Continuar?')){d.confirmed=false;d.unlockedAt=Date.now();save();renderDraws();toast('Sorteo desbloqueado.')}}

function renderDashboard(){if(isClub()){const club=activeClub();const mine=state.entries.filter(e=>e.clubId===club?.id),individual=mine.filter(e=>e.kind==='Individual').length,pairs=mine.filter(e=>e.kind==='Pareja').length,trios=mine.filter(e=>e.kind==='Trío').length;document.getElementById('view-dashboard').innerHTML=`<div class="card club-hero"><div class="detail-title"><div><h2 style="margin:0">${esc(club?.name||'Club')}</h2><div class="meta"><span class="badge green">Sesión de club</span><span class="badge">${mine.length} inscripciones</span></div></div><button class="btn primary" onclick="showView('competitors')">Gestionar inscripciones</button></div><p class="muted">Desde esta cuenta solo puedes crear, editar, duplicar o eliminar deportistas y equipos de tu propio club.</p></div><div class="grid cards" style="margin-top:18px">${[['Individuales',individual],['Parejas',pairs],['Tríos',trios],['Total',mine.length]].map(x=>`<div class="card stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card" style="margin-top:18px"><div class="section-head"><h2>Mis inscripciones por categoría</h2></div><div class="table-wrap"><table><thead><tr><th>Categoría</th><th>Tipo</th><th>Inscritos del club</th><th>Estado del sorteo</th></tr></thead><tbody>${state.categories.map(c=>{const n=mine.filter(e=>e.categoryId===c.id).length;if(!n)return'';const d=state.currentDraws[c.id];return `<tr><td>${esc(c.name)}</td><td>${c.type}</td><td>${n}</td><td>${d?.confirmed?'<span class="badge green">Cerrado / sorteado</span>':d?'<span class="badge orange">Sorteo en preparación</span>':'<span class="badge">Inscripción registrada</span>'}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">Todavía no has inscrito deportistas.</td></tr>'}</tbody></table></div></div>`;return}const individual=state.entries.filter(e=>e.kind==='Individual').length,pairs=state.entries.filter(e=>e.kind==='Pareja').length,trios=state.entries.filter(e=>e.kind==='Trío').length,drawn=Object.keys(state.currentDraws).length,completed=Object.values(state.currentDraws).filter(d=>!!d.result).length,pending=state.categories.filter(c=>entriesFor(c.id).length>0&&!state.currentDraws[c.id]).length;document.getElementById('view-dashboard').innerHTML=`
<div class="grid cards">${[['Deportistas',individual],['Parejas',pairs],['Tríos',trios],['Clubes',state.clubs.length],['Categorías',state.categories.length],['Pendientes de sorteo',pending],['Categorías sorteadas',drawn],['Finalizadas',completed]].map(x=>`<div class="card stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
<div class="card" style="margin-top:18px"><div class="section-head"><h2>Resumen por categoría</h2><div class="actions"><button class="btn primary" onclick="showView('draws')">Ir a sorteos</button></div></div><div class="table-wrap"><table><thead><tr><th>Categoría</th><th>Tipo</th><th>Sistema</th><th>Inscritos</th><th>Clubes</th><th>Estado</th></tr></thead><tbody>${state.categories.map(c=>{const n=entriesFor(c.id).length,d=state.currentDraws[c.id];return `<tr><td>${esc(c.name)}</td><td>${c.type}</td><td><span class="badge ${c.system==='ELIMINATORIA'?'red':'black'}">${c.system}</span></td><td>${n}</td><td>${clubCount(c.id)}</td><td>${d?(d.result?'<span class="badge green">Finalizada</span>':d.confirmed?'<span class="badge green">Sorteo confirmado</span>':'<span class="badge orange">Sorteada</span>'):(n?'<span class="badge">Pendiente</span>':'<span class="muted">Sin inscritos</span>')}</td></tr>`}).join('')}</tbody></table></div></div>`}
function renderCategories(){if(!requireAdmin())return;const v=document.getElementById('view-categories');v.innerHTML=`<div class="section-head"><h2>Categorías</h2><div class="actions"><button class="btn primary" onclick="categoryModal()">+ Nueva categoría</button></div></div><div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Sexo</th><th>Grupo</th><th>Sistema</th><th>Poomsaes</th><th>Inscritos</th><th></th></tr></thead><tbody>${state.categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td>${c.type}</td><td>${c.sex}</td><td>${c.age}</td><td><select onchange="quickSystem('${c.id}',this.value)" ${state.currentDraws[c.id]?.confirmed?'disabled':''}><option ${c.system==='ORDEN'?'selected':''}>ORDEN</option><option ${c.system==='ELIMINATORIA'?'selected':''}>ELIMINATORIA</option></select></td><td>${c.poomsaes.length}</td><td>${entriesFor(c.id).length}</td><td><button class="btn small" onclick="categoryModal('${c.id}')">Editar</button> <button class="btn small danger" onclick="deleteCategory('${c.id}')">Eliminar</button></td></tr>`).join('')}</tbody></table></div>`}
function quickSystem(id,val){if(!requireAdmin())return;const c=catBy(id);if(state.currentDraws[id]?.confirmed)return toast('Desbloquea el sorteo antes de cambiar el sistema.',true);c.system=val;delete state.currentDraws[id];save();toast('Sistema actualizado; el sorteo pendiente se ha invalidado.')}
function categoryModal(id=null){if(!requireAdmin())return;const c=id?catBy(id):{name:'',type:'Individual',sex:'Masculino',age:'cadete',system:'ORDEN',poomsaes:[...POOMSAES.cadete]};openModal(id?'Editar categoría':'Nueva categoría',`<div class="form-grid"><div class="field full"><label>Nombre</label><input id="catName" value="${esc(c.name)}"></div><div class="field"><label>Tipo</label><select id="catType"><option ${c.type==='Individual'?'selected':''}>Individual</option><option ${c.type==='Pareja'?'selected':''}>Pareja</option><option ${c.type==='Trío'?'selected':''}>Trío</option></select></div><div class="field"><label>Sexo</label><select id="catSex"><option ${c.sex==='Masculino'?'selected':''}>Masculino</option><option ${c.sex==='Femenino'?'selected':''}>Femenino</option><option ${c.sex==='Mixto'?'selected':''}>Mixto</option></select></div><div class="field"><label>Grupo de edad</label><select id="catAge" onchange="applyAgePoomsaes()"><option value="cadete" ${c.age==='cadete'?'selected':''}>Cadete</option><option value="junior" ${c.age==='junior'?'selected':''}>Junior</option><option value="senior" ${c.age==='senior'?'selected':''}>Senior</option><option value="master" ${c.age==='master'?'selected':''}>Master</option></select></div><div class="field"><label>Sistema</label><select id="catSystem"><option ${c.system==='ORDEN'?'selected':''}>ORDEN</option><option ${c.system==='ELIMINATORIA'?'selected':''}>ELIMINATORIA</option></select></div><div class="field full"><label>Poomsaes permitidos (mínimo 2)</label><div class="check-grid" id="poomsaeChecks">${ALL_POOMSAES.map(p=>`<label class="check"><input type="checkbox" value="${esc(p)}" ${c.poomsaes.includes(p)?'checked':''}> ${esc(p)}</label>`).join('')}</div></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveCategory('${id||''}')">Guardar</button>`)}
function applyAgePoomsaes(){const age=document.getElementById('catAge').value,allowed=new Set(POOMSAES[age]);document.querySelectorAll('#poomsaeChecks input').forEach(x=>x.checked=allowed.has(x.value))}
function saveCategory(id){if(!requireAdmin())return;const name=document.getElementById('catName').value.trim(),poomsaes=[...document.querySelectorAll('#poomsaeChecks input:checked')].map(x=>x.value);if(!name)return toast('La categoría necesita nombre.',true);if(poomsaes.length<2)return toast('Selecciona al menos 2 poomsaes.',true);if(state.categories.some(x=>x.id!==id&&norm(x.name)===norm(name)))return toast('Ya existe una categoría con ese nombre.',true);const data={name,type:document.getElementById('catType').value,sex:document.getElementById('catSex').value,age:document.getElementById('catAge').value,system:document.getElementById('catSystem').value,poomsaes};if(id){if(state.currentDraws[id]?.confirmed)return toast('Desbloquea el sorteo confirmado antes de editar.',true);Object.assign(catBy(id),data);delete state.currentDraws[id]}else state.categories.push({id:uid('cat'),...data,createdAt:Date.now()});save();closeModal();renderCategories();toast('Categoría guardada.')}
function deleteCategory(id){if(!requireAdmin())return;const n=entriesFor(id).length;if(n&&!confirm(`Esta categoría tiene ${n} inscripciones. Eliminarla también eliminará esas inscripciones y sus sorteos actuales. ¿Continuar?`))return;if(!n&&!confirm('¿Eliminar esta categoría?'))return;state.categories=state.categories.filter(x=>x.id!==id);state.entries=state.entries.filter(e=>e.categoryId!==id);delete state.currentDraws[id];save();renderCategories();toast('Categoría eliminada.')}

function renderAuth(){document.querySelector('.app').style.display='none';document.getElementById('authScreen').classList.add('open');const configured=serverMode?serverConfigured:!!state.auth?.admin?.passwordHash;document.getElementById('authSubtitle').textContent=configured?'Acceso de organización y clubes':'Primer acceso · crear cuenta de organización';document.getElementById('authBody').innerHTML=configured?`<form onsubmit="login(event)"><div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username" autofocus></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:6px" type="submit">Iniciar sesión</button><div class="auth-help">La organización inicia sesión con su cuenta de administrador. Cada club utiliza las credenciales que le haya facilitado la organización.</div></form>`:`<form onsubmit="setupAdmin(event)"><div class="notice">Antes de continuar crea las credenciales de la organización. Serán las que te permitan dar de alta clubes y gestionar todo el campeonato.</div><div class="field" style="margin-top:14px"><label>Usuario administrador</label><input id="setupUser" value="admin" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="setupPass" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label>Repetir contraseña</label><input id="setupPass2" type="password" minlength="8" autocomplete="new-password"></div><button class="btn primary" style="width:100%;margin-top:6px" type="submit">Crear cuenta de organización</button></form>`}
async function setupAdmin(ev){ev.preventDefault();const username=document.getElementById('setupUser').value.trim(),p=document.getElementById('setupPass').value,p2=document.getElementById('setupPass2').value;if(!username)return toast('Introduce un usuario administrador.',true);if(p.length<8)return toast('La contraseña debe tener al menos 8 caracteres.',true);if(p!==p2)return toast('Las contraseñas no coinciden.',true);if(serverMode){try{const d=await api('/api/init',{method:'POST',body:JSON.stringify({username,password:p,state})});serverConfigured=true;session=d.session;await fetchServerState();enterApp()}catch(e){toast(e.message||'No se pudo crear la cuenta.',true)}return}const salt=randomSalt();state.auth.admin={username,passwordSalt:salt,passwordHash:await hashPassword(p,salt),createdAt:Date.now()};await DB.set('state',state);session={role:'admin'};persistSession();enterApp()}
async function login(ev){ev.preventDefault();const username=document.getElementById('loginUser').value.trim(),password=document.getElementById('loginPass').value;if(serverMode){try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username,password})});session=d.session;await fetchServerState();currentView='dashboard';enterApp();return}catch(e){toast(e.message||'Usuario o contraseña incorrectos.',true);return}}const admin=state.auth?.admin;if(admin&&norm(username)===norm(admin.username)&&await hashPassword(password,admin.passwordSalt)===admin.passwordHash){session={role:'admin'};persistSession();enterApp();return}const club=state.clubs.find(c=>c.active!==false&&c.loginUsername&&norm(c.loginUsername)===norm(username));if(club&&club.passwordHash&&await hashPassword(password,club.passwordSalt)===club.passwordHash){session={role:'club',clubId:club.id};persistSession();currentView='dashboard';enterApp();return}toast('Usuario o contraseña incorrectos.',true)}
function enterApp(){document.getElementById('authScreen').classList.remove('open');document.querySelector('.app').style.display='grid';document.getElementById('saveStatus').textContent=serverMode?'Datos compartidos':'Guardado local';document.getElementById('refreshBtn').style.display=serverMode?'inline-block':'none';const items=navItems();if(!items.some(x=>x[0]===currentView))currentView=items[0][0];updateUserUI();showView(currentView)}
function updateUserUI(){const chip=document.getElementById('userChip');if(!session){chip.innerHTML='';return}if(isAdmin())chip.innerHTML=`<b>Organización</b><span>Administrador · ${serverMode?'compartido':'local'}</span>`;else chip.innerHTML=`<b>${esc(activeClub()?.name||'Club')}</b><span>Cuenta de club · ${serverMode?'compartido':'local'}</span>`}
async function logout(){if(serverMode){try{await api('/api/logout',{method:'POST',body:'{}'})}catch(e){}}session=null;if(!serverMode)persistSession();currentView='dashboard';renderAuth()}
function fillGeneratedCredentials(){const name=document.getElementById('clubName').value.trim();document.getElementById('clubUser').value=generatedUsername(name);document.getElementById('clubPass').value=generatedPassword()}

function renderClubs(){if(!requireAdmin())return;const q=filters.clubQ||'';const rows=state.clubs.filter(c=>norm(c.name).includes(norm(q))||norm(c.loginUsername).includes(norm(q)));document.getElementById('view-clubs').innerHTML=`<div class="section-head"><div><h2>Clubes y accesos</h2><p class="muted" style="margin:4px 0 0">Crea el club y sus credenciales. El club usará esta misma pantalla de acceso para gestionar únicamente sus inscripciones.</p></div><button class="btn primary" onclick="clubModal()">+ Dar de alta club</button></div><div class="toolbar"><div class="field grow"><label>Buscar</label><input value="${esc(q)}" oninput="filters.clubQ=this.value;renderClubs()" placeholder="Club o usuario"></div></div><div class="table-wrap"><table><thead><tr><th>Club</th><th>Usuario</th><th>Estado</th><th>Inscripciones</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="seed">${esc(c.loginUsername||'Sin configurar')}</span></td><td>${c.active!==false?'<span class="badge green">Acceso activo</span>':'<span class="badge orange">Acceso bloqueado</span>'}</td><td>${state.entries.filter(e=>e.clubId===c.id).length}</td><td><button class="btn small" onclick="clubModal('${c.id}')">Editar / acceso</button> <button class="btn small danger" onclick="deleteClub('${c.id}')">Eliminar</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No hay clubes.</td></tr>'}</tbody></table></div><div class="notice" style="margin-top:14px"><b>Importante:</b> las contraseñas no pueden recuperarse porque se guardan mediante hash. Si un club la pierde, edita el club y establece una nueva.</div>`}
function clubModal(id=null){if(!requireAdmin())return;const c=id?clubBy(id):{name:'',loginUsername:'',active:true};openModal(id?'Editar club y acceso':'Dar de alta club',`<div class="form-grid"><div class="field full"><label>Nombre del club</label><input id="clubName" value="${esc(c.name)}" autofocus oninput="if(!'${id||''}'&&!document.getElementById('clubUser').dataset.touched)document.getElementById('clubUser').value=generatedUsername(this.value)"></div><div class="field"><label>Usuario de acceso</label><input id="clubUser" data-touched="" oninput="this.dataset.touched='1'" value="${esc(c.loginUsername||'')}"></div><div class="field"><label>${id?'Nueva contraseña (dejar vacía para conservar)':'Contraseña'}</label><input id="clubPass" type="text" autocomplete="off"></div><div class="field full"><button class="btn" type="button" onclick="fillGeneratedCredentials()">Generar usuario y contraseña</button></div><div class="field full"><label class="check"><input type="checkbox" id="clubActive" ${c.active!==false?'checked':''}> Permitir que este club inicie sesión</label></div></div><p class="security-note">Entrega al club el usuario y la contraseña. Después de guardar la contraseña no volverá a mostrarse; si se pierde tendrás que restablecerla.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveClub('${id||''}')">Guardar club</button>`)}
async function saveClub(id){if(!requireAdmin())return;const name=document.getElementById('clubName').value.trim(),username=document.getElementById('clubUser').value.trim(),password=document.getElementById('clubPass').value,active=document.getElementById('clubActive').checked;if(!name)return toast('Introduce el nombre del club.',true);if(!username)return toast('Asigna un usuario de acceso.',true);if(state.clubs.some(c=>c.id!==id&&norm(c.name)===norm(name)))return toast('Ya existe un club con un nombre equivalente.',true);if(state.clubs.some(c=>c.id!==id&&c.loginUsername&&norm(c.loginUsername)===norm(username)))return toast('Ese usuario ya pertenece a otro club.',true);if(state.auth?.admin&&norm(state.auth.admin.username)===norm(username))return toast('Ese usuario coincide con el administrador.',true);if(!id&&!password)return toast('Asigna una contraseña al nuevo club.',true);if(password&&password.length<8)return toast('La contraseña debe tener al menos 8 caracteres.',true);const plain=password||null;if(serverMode){try{await api('/api/admin/clubs',{method:'POST',body:JSON.stringify({id:id||'',name,username,password,active})});await fetchServerState();closeModal();renderClubs();if(plain)openModal('Credenciales del club',`<p>Entrega estas credenciales a <b>${esc(name)}</b>. La contraseña solo se muestra ahora.</p><div class="credential-box">Usuario: ${esc(username)}<br>Contraseña: ${esc(plain)}</div><p class="security-note">Si el club pierde la contraseña, restablécela desde Clubes → Editar / acceso.</p>`,`<button class="btn primary" onclick="closeModal()">He guardado las credenciales</button>`);else toast('Club actualizado.')}catch(e){toast(e.message,true)}return}let c=id?clubBy(id):null;if(!c){c={id:uid('club'),name,loginUsername:username,active,createdAt:Date.now(),passwordSalt:'',passwordHash:''};state.clubs.push(c)}else Object.assign(c,{name,loginUsername:username,active,updatedAt:Date.now()});if(password){const salt=randomSalt();c.passwordSalt=salt;c.passwordHash=await hashPassword(password,salt)}save();closeModal();renderClubs();if(plain)openModal('Credenciales del club',`<p>Entrega estas credenciales a <b>${esc(name)}</b>. La contraseña solo se muestra ahora.</p><div class="credential-box">Usuario: ${esc(username)}<br>Contraseña: ${esc(plain)}</div>`,`<button class="btn primary" onclick="closeModal()">He guardado las credenciales</button>`)}
async function deleteClub(id){if(!requireAdmin())return;const used=state.entries.filter(e=>e.clubId===id).length;if(used)return toast(`No se puede eliminar: tiene ${used} inscripciones asociadas. Reasígnalas o elimínalas primero.`,true);if(!confirm('¿Eliminar este club y su acceso?'))return;if(serverMode){try{await api('/api/admin/clubs/'+encodeURIComponent(id),{method:'DELETE'});await fetchServerState();renderClubs();toast('Club eliminado.')}catch(e){toast(e.message,true)}return}state.clubs=state.clubs.filter(x=>x.id!==id);save();renderClubs();toast('Club eliminado.')}

function renderCompetitors(){const f=filters.comp||{},scope=isClub()?state.entries.filter(e=>e.clubId===activeClubId()):state.entries;let rows=scope.filter(e=>(!f.cat||e.categoryId===f.cat)&&(!f.club||e.clubId===f.club)&&(!f.type||e.kind===f.type)&&(!f.sex||catBy(e.categoryId)?.sex===f.sex)&&(!f.q||norm(entryName(e)).includes(norm(f.q))));document.getElementById('view-competitors').innerHTML=`<div class="section-head"><div><h2>${isClub()?'Inscripciones de '+esc(activeClub()?.name||'mi club'):'Competidores'}</h2>${isClub()?'<p class="muted" style="margin:4px 0 0">Solo se muestran y modifican las inscripciones de tu club.</p>':''}</div><div class="actions"><button class="btn primary" onclick="entryModal()">+ Inscribir</button></div></div><div class="toolbar"><div class="field"><label>Categoría</label><select onchange="setCompFilter('cat',this.value)"><option value="">Todas</option>${state.categories.map(c=>`<option value="${c.id}" ${f.cat===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${isAdmin()?`<div class="field"><label>Club</label><select onchange="setCompFilter('club',this.value)"><option value="">Todos</option>${state.clubs.map(c=>`<option value="${c.id}" ${f.club===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}<div class="field"><label>Tipo</label><select onchange="setCompFilter('type',this.value)"><option value="">Todos</option>${['Individual','Pareja','Trío'].map(x=>`<option ${f.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Sexo</label><select onchange="setCompFilter('sex',this.value)"><option value="">Todos</option>${['Masculino','Femenino','Mixto'].map(x=>`<option ${f.sex===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field grow"><label>Buscar</label><input value="${esc(f.q||'')}" oninput="setCompFilter('q',this.value)" placeholder="Nombre"></div></div><div class="table-wrap"><table><thead><tr><th>Nombre / equipo</th><th>Tipo</th>${isAdmin()?'<th>Club</th>':''}<th>Categoría</th><th>Miembros</th><th></th></tr></thead><tbody>${rows.map(e=>`<tr><td><b>${esc(entryName(e))}</b></td><td>${e.kind}</td>${isAdmin()?`<td>${esc(clubName(e))}</td>`:''}<td>${esc(catBy(e.categoryId)?.name||'—')}</td><td>${e.members?.map(esc).join(' · ')||'—'}</td><td><button class="btn small" onclick="entryModal('${e.id}')">Editar</button> <button class="btn small" onclick="duplicateEntry('${e.id}')">Duplicar</button> <button class="btn small danger" onclick="deleteEntry('${e.id}')">Eliminar</button></td></tr>`).join('')||`<tr><td colspan="${isAdmin()?6:5}" class="empty">No hay inscripciones con estos filtros.</td></tr>`}</tbody></table></div>`}
function setCompFilter(k,v){filters.comp={...(filters.comp||{}),[k]:v};renderCompetitors()}
function entryModal(id=null){if(id&&!requireOwnEntry(id))return;if(!state.clubs.length)return toast('La organización debe crear al menos un club.',true);const fixedClub=isClub()?activeClubId():null,e=id?entryBy(id):{kind:'Individual',categoryId:'',clubId:fixedClub||'',firstName:'',lastName:'',name:'',members:[]};openModal(id?'Editar inscripción':'Nueva inscripción',`<div class="form-grid"><div class="field"><label>Tipo</label><select id="eKind" onchange="refreshEntryForm()"><option ${e.kind==='Individual'?'selected':''}>Individual</option><option ${e.kind==='Pareja'?'selected':''}>Pareja</option><option ${e.kind==='Trío'?'selected':''}>Trío</option></select></div><div class="field"><label>Club</label>${isClub()?`<div class="readonly-club">${esc(activeClub()?.name||'Club')}</div><input type="hidden" id="eClub" value="${esc(activeClubId())}">`:`<select id="eClub"><option value="">Seleccionar…</option>${state.clubs.map(c=>`<option value="${c.id}" ${e.clubId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>`}</div><div class="field full"><label>Categoría</label><select id="eCat"></select></div><div class="full" id="entrySpecific"></div></div>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveEntry('${id||''}')">Guardar</button>`);window._editingEntry=deep(e);refreshEntryForm()}
function refreshEntryForm(){const kind=document.getElementById('eKind').value,e=window._editingEntry||{},cat=document.getElementById('eCat');cat.innerHTML='<option value="">Seleccionar…</option>'+state.categories.filter(c=>c.type===kind).map(c=>`<option value="${c.id}" ${e.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');let html='';if(kind==='Individual')html=`<div class="form-grid"><div class="field"><label>Nombre</label><input id="eFirst" value="${esc(e.firstName||'')}"></div><div class="field"><label>Apellidos</label><input id="eLast" value="${esc(e.lastName||'')}"></div></div>`;else{const n=kind==='Pareja'?2:3;html=`<div class="form-grid"><div class="field full"><label>Nombre o identificador del ${kind.toLowerCase()}</label><input id="eName" value="${esc(e.name||'')}"></div>${[...Array(n)].map((_,i)=>`<div class="field ${i===n-1&&n===3?'full':''}"><label>Competidor ${i+1}</label><input id="eM${i}" value="${esc(e.members?.[i]||'')}"></div>`).join('')}</div>`}document.getElementById('entrySpecific').innerHTML=html}
function saveEntry(id){if(id&&!requireOwnEntry(id))return;const kind=document.getElementById('eKind').value,clubId=isClub()?activeClubId():document.getElementById('eClub').value,categoryId=document.getElementById('eCat').value;if(!clubId)return toast('Selecciona un club.',true);if(isClub()&&clubId!==activeClubId())return toast('No puedes inscribir deportistas para otro club.',true);if(!categoryId)return toast('Selecciona una categoría.',true);let data={kind,clubId,categoryId};if(kind==='Individual'){const firstName=document.getElementById('eFirst').value.trim(),lastName=document.getElementById('eLast').value.trim();if(!firstName)return toast('El participante necesita nombre.',true);data={...data,firstName,lastName,name:'',members:[]}}else{const name=document.getElementById('eName').value.trim(),count=kind==='Pareja'?2:3,members=[...Array(count)].map((_,i)=>document.getElementById('eM'+i).value.trim());if(!name)return toast('El equipo necesita nombre o identificador.',true);if(members.some(x=>!x))return toast(`${kind} incompleto: faltan competidores.`,true);data={...data,name,members,firstName:'',lastName:''}}const key=norm(kind==='Individual'?`${data.firstName} ${data.lastName}`:data.name);if(state.entries.some(x=>x.id!==id&&x.categoryId===categoryId&&x.clubId===clubId&&norm(entryName(x))===key))return toast('Parece una inscripción duplicada en la misma categoría y club.',true);const oldCategoryId=id?entryBy(id)?.categoryId:null;if(state.currentDraws[categoryId]?.confirmed||oldCategoryId&&state.currentDraws[oldCategoryId]?.confirmed)return toast('Esta categoría ya tiene el sorteo confirmado y no admite cambios de inscripción.',true);if(id)Object.assign(entryBy(id),data,{updatedAt:Date.now()});else state.entries.push({id:uid('entry'),...data,createdAt:Date.now(),createdBy:isClub()?'club':'admin'});delete state.currentDraws[categoryId];if(oldCategoryId)delete state.currentDraws[oldCategoryId];save();closeModal();renderCompetitors();toast('Inscripción guardada.')}
function duplicateEntry(id){if(!requireOwnEntry(id))return;const e=deep(entryBy(id));if(isClub())e.clubId=activeClubId();e.id=uid('entry');e.name=e.kind==='Individual'?e.name:e.name+' (copia)';if(e.kind==='Individual')e.firstName=e.firstName+' (copia)';e.createdAt=Date.now();e.createdBy=isClub()?'club':'admin';state.entries.push(e);delete state.currentDraws[e.categoryId];save();renderCompetitors();toast('Inscripción duplicada; edítala para evitar confusiones.')}
function deleteEntry(id){if(!requireOwnEntry(id))return;const e=entryBy(id);if(state.currentDraws[e.categoryId]?.confirmed)return toast('Esta categoría ya tiene el sorteo confirmado y no admite cambios.',true);if(confirm('¿Eliminar esta inscripción?')){state.entries=state.entries.filter(x=>x.id!==id);delete state.currentDraws[e.categoryId];save();renderCompetitors();toast('Inscripción eliminada.')}}

function drawCategory(id,fromAll=false){if(!requireAdmin())return;const c=catBy(id),old=state.currentDraws[id];if(old?.confirmed)return toast('Este sorteo está bloqueado. Desbloquéalo para repetirlo.',true);const es=entriesFor(id);if(!es.length)return toast('No hay inscritos en esta categoría.',true);const feas=c.system==='ELIMINATORIA'?clubFeasibility(es):{possible:true};let forceBest=false;if(!feas.possible){const club=clubBy(Object.entries(feas.counts).sort((a,b)=>b[1]-a[1])[0]?.[0]);const ok=confirm(`Con la composición actual de esta categoría no es posible garantizar que todos los participantes del mismo club se enfrenten únicamente en la final.\n\n${club?.name||'Un club'} tiene ${feas.max} inscripciones.\n\nAceptar: generar la distribución más separada posible.\nCancelar: no generar el sorteo.`);if(!ok)return null;forceBest=true}if(old&&!fromAll&&!confirm('Ya existe un sorteo no bloqueado. ¿Generar uno nuevo? El anterior seguirá en el historial.'))return null;let manual=fromAll?null:prompt('Seed manual (opcional). Déjala vacía para generar una automáticamente:','');try{const d=makeDraw(c,manual||null,forceBest);selectedDrawCategory=id;renderDraws();toast('Sorteo generado.');return d}catch(e){toast(e.message,true);return null}}
function drawAll(){if(!requireAdmin())return;const cats=state.categories.filter(c=>entriesFor(c.id).length);if(!cats.length)return toast('No hay categorías con inscritos.',true);if(!confirm(`Se sortearán ${cats.length} categorías con inscritos. Se respetarán los sorteos confirmados. ¿Continuar?`))return;let ok=0,skipped=0;for(const c of cats){if(state.currentDraws[c.id]?.confirmed){skipped++;continue}const es=entriesFor(c.id),feas=c.system==='ELIMINATORIA'?clubFeasibility(es):{possible:true};let forceBest=false;if(!feas.possible){const proceed=confirm(`${c.name}: la separación por clubes hasta la final es matemáticamente imposible.\n\nAceptar: generar la mejor distribución posible.\nCancelar: omitir esta categoría.`);if(!proceed){skipped++;continue}forceBest=true}try{makeDraw(c,null,forceBest);ok++}catch(e){skipped++}}renderDraws();toast(`Sorteo masivo terminado: ${ok} generados, ${skipped} omitidos/bloqueados.`)}
function renderDraws(){if(!requireAdmin())return;if(!selectedDrawCategory||!catBy(selectedDrawCategory))selectedDrawCategory=state.categories.find(c=>entriesFor(c.id).length)?.id||state.categories[0]?.id;const c=catBy(selectedDrawCategory),d=state.currentDraws[selectedDrawCategory];document.getElementById('view-draws').innerHTML=`<div class="section-head"><h2>Sorteos</h2><div class="actions"><button class="btn dark" onclick="drawAll()">🎲 Sortear todas las categorías</button></div></div><div class="split"><div class="card list-card">${state.categories.map(x=>{const n=entriesFor(x.id).length,dd=state.currentDraws[x.id];return `<button class="${x.id===selectedDrawCategory?'active':''}" onclick="selectedDrawCategory='${x.id}';renderDraws()"><b>${esc(x.name)}</b><br><span class="muted">${n} inscritos · ${dd?(dd.confirmed?'🔒 confirmado':'sorteado'):'pendiente'}</span></button>`}).join('')}</div><div>${c?drawDetail(c,d):'<div class="card empty">No hay categorías.</div>'}</div></div>`}
function drawDetail(c,d){const es=entriesFor(c.id);return `<div class="card"><div class="detail-title"><div><h3>${esc(c.name)}</h3><div class="meta"><span class="badge">${c.type}</span><span class="badge">${c.sex}</span><span class="badge ${c.system==='ELIMINATORIA'?'red':'black'}">${c.system}</span><span class="badge">${es.length} inscritos</span><span class="badge">${clubCount(c.id)} clubes</span></div></div><div class="actions"><button class="btn primary" ${d?.confirmed?'disabled':''} onclick="drawCategory('${c.id}')">🎲 ${d?'Repetir sorteo':'Realizar sorteo'}</button>${d?`<button class="btn" onclick="printDraw('${c.id}')">Imprimir</button>`:''}</div></div><div class="notice">Rango: ${c.poomsaes.map(esc).join(' · ')}<br>Rondas de poomsae automáticas: <b>${poomsaeRoundNames(es.length||1).join(' → ')}</b></div>${d?renderDrawResult(d):'<div class="empty">Aún no se ha realizado el sorteo.</div>'}</div>`}
function renderDrawResult(d){let validation='';if(d.system==='ELIMINATORIA'){if(d.bracket.validation.valid)validation='<div class="notice ok">✓ La distribución mantiene separados a los miembros del mismo club hasta la final.</div>';else validation=`<div class="notice error"><b>Separación total imposible.</b> Esta es la distribución más separada encontrada.<br>${d.bracket.validation.violations.map(v=>{const a=d.participants.find(x=>x.id===v.a),b=d.participants.find(x=>x.id===v.b);return `${esc(entryName(a))} y ${esc(entryName(b))} (${esc(a?.clubName||'')}) podrían coincidir en <b>${v.roundName}</b>.`}).join('<br>')}</div>`}
return `<div class="meta"><span>Seed <span class="seed">${esc(d.seed)}</span></span><span>${fmtDate(d.createdAt)}</span><span>ID <span class="seed">${d.id}</span></span>${d.confirmed?'<span class="badge green">🔒 Confirmado</span>':'<span class="badge orange">No confirmado</span>'}</div><div class="round-boxes">${d.poomsaeRounds.map(r=>`<div class="round-box"><h4>${r.name}</h4><div class="poomsae">1. ${esc(r.poomsaes[0])}</div><div class="poomsae">2. ${esc(r.poomsaes[1])}</div></div>`).join('')}</div><div class="hr"></div>${validation}<h3>${d.system==='ORDEN'?'Orden de salida':'Cuadro de competición'}</h3>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}<div class="actions" style="margin-top:16px">${d.confirmed?`<button class="btn danger" onclick="unlockDraw('${d.categoryId}')">Desbloquear sorteo</button>`:`<button class="btn dark" onclick="confirmDraw('${d.categoryId}')">🔒 Confirmar sorteo</button>`}</div>`}
function renderOrder(d){return `<div class="table-wrap"><table><thead><tr><th>Nº</th><th>Participante/equipo</th><th>Club</th></tr></thead><tbody>${d.order.map(o=>{const e=d.participants.find(x=>x.id===o.entryId);return `<tr><td>${o.position}</td><td><b>${esc(entryName(e))}</b></td><td>${esc(e?.clubName||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function renderBracket(d,interactive=true){const b=d.bracket;return `<div class="bracket-scroll"><div class="bracket">${b.rounds.map((r,ri)=>`<div class="bracket-round"><h4>${r.name}</h4><div class="matches">${r.matches.map((m,mi)=>`<div class="match">${renderSlot(d,m,m.p1,ri,mi,interactive,1)}${renderSlot(d,m,m.p2,ri,mi,interactive,2)}${interactive&&m.winnerId&&!((m.p1&&!m.p2)||(!m.p1&&m.p2))?`<div style="text-align:right;margin-top:5px"><button class="btn small" onclick="undoWinner('${d.categoryId}',${ri},${mi})">Deshacer resultado</button></div>`:''}</div>`).join('')}</div></div>`).join('')}</div></div>`}
function renderSlot(d,m,id,ri,mi,interactive,side){if(!id){const hasPotential=slotCanStillProduce(d.bracket,m,side,ri);const label=ri===0||!hasPotential?'BYE':'PENDIENTE';return `<div class="slot ${label==='BYE'?'bye':''}"><div class="who"><div class="name">${label}</div></div></div>`;}const e=d.participants.find(x=>x.id===id),win=m.winnerId===id;return `<div class="slot ${win?'winner':''}"><div class="who"><div class="name">${esc(entryName(e))}</div><div class="club">${esc(e?.clubName||'')}</div></div>${interactive&&m.p1&&m.p2&&!m.winnerId?`<button class="win-btn" onclick="selectWinner('${d.categoryId}',${ri},${mi},'${id}')">Ganador</button>`:(win?'✓':'')}</div>`}

function renderCompetition(){if(!requireAdmin())return;const draws=Object.values(state.currentDraws).filter(d=>d.confirmed);if(!filters.compCat||!state.currentDraws[filters.compCat]?.confirmed)filters.compCat=draws[0]?.categoryId||'';const d=state.currentDraws[filters.compCat];document.getElementById('view-competition').innerHTML=`<div class="section-head"><h2>Competición</h2></div><div class="toolbar"><div class="field grow"><label>Categoría con sorteo confirmado</label><select onchange="filters.compCat=this.value;renderCompetition()"><option value="">Seleccionar…</option>${draws.map(x=>`<option value="${x.categoryId}" ${filters.compCat===x.categoryId?'selected':''}>${esc(x.categoryName)}</option>`).join('')}</select></div></div>${!d?'<div class="card empty">Confirma un sorteo para gestionar la competición.</div>':`<div class="card"><div class="detail-title"><div><h3>${esc(d.categoryName)}</h3><div class="meta"><span class="badge ${d.system==='ELIMINATORIA'?'red':'black'}">${d.system}</span><span class="seed">${esc(d.seed)}</span></div></div><button class="btn" onclick="printCompetition('${d.categoryId}')">Imprimir</button></div>${d.system==='ELIMINATORIA'?renderBracket(d,true):renderOrderCompetition(d)}</div>`}`}
function renderOrderCompetition(d){const choices=d.participants.map(e=>`<option value="${e.id}">${esc(entryName(e))} — ${esc(e.clubName)}</option>`).join('');return `<div class="notice">El modo Orden no define puntuaciones automáticas en el pliego. Registra aquí la clasificación final una vez obtenidas las notas oficiales.</div>${renderOrder(d)}<div class="hr"></div><div class="form-grid"><div class="field"><label>🥇 Campeón</label><select id="ordGold"><option value="">—</option>${choices}</select></div><div class="field"><label>🥈 Subcampeón</label><select id="ordSilver"><option value="">—</option>${choices}</select></div>${state.settings.thirdPlace?`<div class="field"><label>🥉 Tercer puesto</label><select id="ordBronze"><option value="">—</option>${choices}</select></div>`:''}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveOrderResult('${d.categoryId}')">Guardar resultado</button></div>${d.result?renderPodium(d):''}`}
function saveOrderResult(catId){const d=state.currentDraws[catId],g=document.getElementById('ordGold').value,s=document.getElementById('ordSilver').value,b=state.settings.thirdPlace?document.getElementById('ordBronze').value:null;if(!g||!s||g===s)return toast('Selecciona campeón y subcampeón distintos.',true);if(b&&[g,s].includes(b))return toast('El tercer puesto debe ser distinto.',true);d.result={championId:g,runnerUpId:s,thirdId:b||null,completedAt:Date.now()};save();renderCompetition();toast('Resultado guardado.')}
function chooseThird(catId,id){const d=state.currentDraws[catId];if(!d.result)return;d.result.thirdId=id||null;save();renderCompetition()}

function renderResults(){if(!requireAdmin())return;const done=Object.values(state.currentDraws).filter(d=>d.result);document.getElementById('view-results').innerHTML=`<div class="section-head"><h2>Resultados</h2><button class="btn" onclick="printResults()">Imprimir resultados</button></div>${done.length?done.map(d=>`<div class="card" style="margin-bottom:14px"><div class="detail-title"><div><h3>${esc(d.categoryName)}</h3><div class="meta"><span class="badge">${d.system}</span><span>${fmtDate(d.result.completedAt)}</span></div></div></div>${renderPodium(d)}${d.system==='ELIMINATORIA'&&state.settings.thirdPlace&&!d.result.thirdId?renderThirdSelector(d):''}</div>`).join(''):'<div class="card empty">Todavía no hay categorías finalizadas.</div>'}`}
function renderPodium(d){const e=id=>d.participants.find(x=>x.id===id);const g=e(d.result.championId),s=e(d.result.runnerUpId),b=e(d.result.thirdId);return `<div class="podium"><div class="place"><div class="medal">🥇</div><b>${esc(entryName(g))}</b><span>${esc(g?.clubName||'')}</span></div><div class="place"><div class="medal">🥈</div><b>${esc(entryName(s))}</b><span>${esc(s?.clubName||'')}</span></div>${state.settings.thirdPlace?`<div class="place"><div class="medal">🥉</div><b>${esc(entryName(b)||'Pendiente')}</b><span>${esc(b?.clubName||'')}</span></div>`:''}</div>`}
function renderThirdSelector(d){const semi=d.bracket.rounds.at(-2);if(!semi)return'';const losers=[];semi.matches.forEach(m=>{if(m.winnerId&&m.p1&&m.p2)losers.push(m.winnerId===m.p1?m.p2:m.p1)});return `<div class="field" style="margin-top:12px"><label>Seleccionar tercer puesto entre semifinalistas derrotados</label><select onchange="chooseThird('${d.categoryId}',this.value)"><option value="">—</option>${losers.map(id=>{const e=d.participants.find(x=>x.id===id);return `<option value="${id}">${esc(entryName(e))}</option>`}).join('')}</select></div>`}

function renderHistory(){if(!requireAdmin())return;document.getElementById('view-history').innerHTML=`<div class="section-head"><h2>Historial de sorteos</h2><span class="muted">Copias inmutables creadas en el momento del sorteo</span></div>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>ID</th><th>Categoría</th><th>Sistema</th><th>Seed</th><th>Inscritos</th><th>Validación clubes</th><th></th></tr></thead><tbody>${state.history.map((h,i)=>`<tr><td>${fmtDate(h.createdAt)}</td><td><span class="seed">${h.id}</span></td><td>${esc(h.categoryName)}</td><td>${h.system}</td><td><span class="seed">${esc(h.seed)}</span></td><td>${h.entryCount}</td><td>${h.system==='ORDEN'?'N/A':h.bracket.validation.valid?'<span class="badge green">Válida</span>':'<span class="badge orange">Mejor posible</span>'}</td><td><button class="btn small" onclick="showHistory(${i})">Ver copia</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No hay sorteos históricos.</div>'}`}
function showHistory(i){const h=state.history[i];openModal('Sorteo histórico · '+h.categoryName,`<div class="meta"><span>ID <span class="seed">${h.id}</span></span><span>Seed <span class="seed">${esc(h.seed)}</span></span><span>${fmtDate(h.createdAt)}</span></div><div class="round-boxes">${h.poomsaeRounds.map(r=>`<div class="round-box"><h4>${r.name}</h4><div>${esc(r.poomsaes.join(' · '))}</div></div>`).join('')}</div><div class="hr"></div>${h.system==='ORDEN'?renderOrder(h):renderBracket(h,false)}`,'<button class="btn" onclick="closeModal()">Cerrar</button>')}

function renderSettings(){if(!requireAdmin())return;document.getElementById('view-settings').innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><div class="card"><h3>Configuración general</h3><div class="field"><label>Nombre de la organización / sistema</label><input id="eventName" value="${esc(state.settings.eventName||'')}"></div><label class="check" style="margin-top:12px"><input type="checkbox" id="thirdPlace" ${state.settings.thirdPlace?'checked':''}> Habilitar tercer puesto</label><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="saveSettings()">Guardar</button></div></div><div class="card"><h3>Importación y exportación</h3><p class="muted">El JSON contiene competiciones, categorías, clubes, inscripciones, precios registrados, sorteos actuales, historial, resultados y configuración.</p><div class="actions"><button class="btn dark" onclick="exportData()">Exportar campeonato</button><label class="btn" style="display:inline-block">Importar JSON<input type="file" accept="application/json" hidden onchange="importData(this.files[0]);this.value=''"/></label></div></div><div class="card"><h3>Comprobaciones automáticas</h3><p class="muted">Ejecuta los 8 casos mínimos del pliego sobre la lógica de rondas, poomsaes, separación por clubes y BYEs.</p><button class="btn" onclick="showTests()">Ejecutar pruebas</button><div id="testOutput" style="margin-top:12px"></div></div><div class="card"><h3>Cuenta de organización</h3><p class="muted">Usuario actual: <span class="seed">${esc(state.auth?.admin?.username||'')}</span></p><button class="btn" onclick="adminCredentialsModal()">Cambiar credenciales</button></div><div class="card"><h3>Uso por varios clubes</h3><p class="muted">${serverMode?'La web multiusuario está ACTIVA. Los clubes pueden entrar desde cualquier dispositivo usando el enlace público y sus credenciales.':'Este archivo se está usando sin servidor. Para uso real por Internet, publícalo con el servidor Node.js y PostgreSQL incluidos en el paquete.'}</p></div><div class="card danger-zone"><h3>Reiniciar campeonato</h3><p class="muted">Borra inscripciones, sorteos, resultados e historial. Durante el reinicio podrás conservar categorías, clubes y competiciones.</p><button class="btn danger" onclick="resetChampionship()">Reiniciar campeonato</button></div></div>`}
function adminCredentialsModal(){if(!requireAdmin())return;openModal('Credenciales de organización',`<div class="form-grid"><div class="field full"><label>Usuario administrador</label><input id="adminUser" value="${esc(state.auth?.admin?.username||'admin')}"></div><div class="field"><label>Nueva contraseña</label><input id="adminPass" type="password" minlength="8"></div><div class="field"><label>Repetir contraseña</label><input id="adminPass2" type="password" minlength="8"></div></div><p class="security-note">Si no quieres cambiar la contraseña, deja ambos campos vacíos.</p>`,`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="saveAdminCredentials()">Guardar</button>`)}
async function saveAdminCredentials(){if(!requireAdmin())return;const username=document.getElementById('adminUser').value.trim(),p=document.getElementById('adminPass').value,p2=document.getElementById('adminPass2').value;if(!username)return toast('Introduce un usuario.',true);if(state.clubs.some(c=>c.loginUsername&&norm(c.loginUsername)===norm(username)))return toast('Ese usuario ya pertenece a un club.',true);if((p||p2)&&p!==p2)return toast('Las contraseñas no coinciden.',true);if(p&&p.length<8)return toast('La contraseña debe tener al menos 8 caracteres.',true);if(serverMode){try{await api('/api/admin/credentials',{method:'POST',body:JSON.stringify({username,password:p})});state.auth.admin={username};closeModal();renderSettings();toast('Credenciales de organización actualizadas.')}catch(e){toast(e.message,true)}return}state.auth.admin.username=username;if(p){const salt=randomSalt();state.auth.admin.passwordSalt=salt;state.auth.admin.passwordHash=await hashPassword(p,salt)}save();closeModal();renderSettings();toast('Credenciales de organización actualizadas.')}
function saveSettings(){if(!requireAdmin())return;state.settings.eventName=document.getElementById('eventName').value.trim()||'Campeonato de Poomsae';state.settings.thirdPlace=document.getElementById('thirdPlace').checked;save();toast('Configuración guardada.')}
function exportData(){if(!requireAdmin())return;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='campeonato_poomsae_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Campeonato exportado.')}
async function importData(file){if(!requireAdmin())return;if(!requireAdmin())return;if(!file)return;if(!confirm('La importación sobrescribirá el campeonato actual. ¿Continuar?'))return;try{const obj=JSON.parse(await file.text());if(!obj.categories||!obj.clubs||!obj.entries)throw new Error('JSON no compatible.');state=obj;migrateState();state.currentDraws=state.currentDraws||{};state.history=state.history||[];if(serverMode)await api('/api/state',{method:'PUT',body:JSON.stringify({state})});else await DB.set('state',state);toast('Campeonato restaurado.');renderCurrent()}catch(e){toast('No se pudo importar: '+e.message,true)}}
function resetChampionship(){if(!requireAdmin())return;const keepCats=confirm('¿Quieres CONSERVAR las categorías y rangos de poomsae?\nAceptar = conservar. Cancelar = restaurar las 26 categorías iniciales.');const keepClubs=confirm('¿Quieres CONSERVAR los clubes Y SUS CREDENCIALES?\nAceptar = conservar. Cancelar = borrarlos.');if(!confirm('ÚLTIMA CONFIRMACIÓN: se borrarán inscripciones, sorteos, resultados e historial. ¿Continuar?'))return;const cats=keepCats?state.categories:defaultCategories(),clubs=keepClubs?state.clubs:[],auth=deep(state.auth),settings=deep(state.settings);state=initialState();state.categories=cats;state.clubs=clubs;state.auth=auth;state.settings=settings;save();renderSettings();toast('Campeonato reiniciado.')}
function selfTests(){const out=[];const assert=(name,cond,detail='')=>out.push({name,ok:!!cond,detail});[5,8,9,16,17].forEach(n=>{const names=poomsaeRoundNames(n),expected=n<=8?1:n<=16?2:5;out.push({name:`Rondas para ${n} inscritos`,ok:names.length===expected,detail:names.join(' → ')})});
  const mk=(n,clubs)=>[...Array(n)].map((_,i)=>({id:'t'+i,clubId:'c'+clubs[i],kind:'Individual',firstName:'P'+i,lastName:'',categoryId:'x'}));
  let r=seeded('case6'),b=buildBracket(mk(4,[1,1,2,3]),r,false);out.push({name:'Caso 6 · dos del mismo club',ok:b.validation.valid&&b.validation.violations.length===0,detail:'Separados hasta la final'});
  r=seeded('case7');b=buildBracket(mk(5,[1,1,1,2,3]),r,true);out.push({name:'Caso 7 · imposibilidad detectada',ok:!b.validation.possible&&b.validation.violations.length>0,detail:`${b.validation.violations.length} posible(s) cruce(s) previo(s)`});
  r=seeded('case8');b=buildBracket(mk(6,[1,2,3,4,5,6]),r,false);const pids=b.rounds[0].matches.flatMap(m=>[m.p1,m.p2]).filter(Boolean);out.push({name:'Caso 8 · 6 participantes y BYEs',ok:b.size===8&&new Set(pids).size===6&&pids.length===6,detail:`Bracket ${b.size}; ${b.size-6} BYEs`});
  const fake={poomsaes:[...POOMSAES.cadete]};[5,9,17].forEach(n=>{const rounds=drawPoomsaes(fake,n,seeded('p'+n));out.push({name:`2 poomsaes distintos por ronda (${n})`,ok:rounds.every(x=>x.poomsaes.length===2&&x.poomsaes[0]!==x.poomsaes[1]),detail:`${rounds.length*2} poomsaes sorteados`})});return out}
function showTests(){if(!requireAdmin())return;const r=selfTests(),ok=r.every(x=>x.ok);document.getElementById('testOutput').innerHTML=`<div class="notice ${ok?'ok':'error'}"><b>${ok?'✓ Todas las pruebas han pasado':'Hay pruebas fallidas'}</b></div><div class="table-wrap" style="margin-top:8px"><table><tbody>${r.map(x=>`<tr><td>${x.ok?'✅':'❌'}</td><td>${esc(x.name)}</td><td>${esc(x.detail)}</td></tr>`).join('')}</tbody></table></div>`}

function printWindow(title,html,landscape=false){const w=window.open('','_blank');w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>@page{size:${landscape?'landscape':'portrait'};margin:12mm}body{font-family:Arial,sans-serif;color:#111}h1{font-size:20px}h2{font-size:15px;margin-top:20px}table{width:100%;border-collapse:collapse}th,td{padding:7px;border-bottom:1px solid #ddd;text-align:left;font-size:12px}.seed{font-family:monospace}.rounds{display:flex;gap:10px;flex-wrap:wrap}.r{border:1px solid #ccc;border-radius:8px;padding:10px;min-width:160px}.bracket{display:flex;gap:28px;align-items:stretch}.bracket-round{width:190px}.matches{display:flex;flex-direction:column;justify-content:space-around;height:100%;gap:14px}.match{border:1px solid #bbb;padding:6px;border-radius:6px}.slot{padding:5px}.club{font-size:10px;color:#666}.name{font-weight:bold;font-size:11px}.bye{color:#888}.win-btn,button{display:none}</style></head><body><h1>${esc(state.settings.eventName||'Campeonato de Poomsae')}</h1>${html}<script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()}
function printDraw(catId){const d=state.currentDraws[catId];if(!d)return;const html=`<h2>${esc(d.categoryName)} · ${d.system}</h2><p>Fecha: ${fmtDate(d.createdAt)} · Seed: <span class="seed">${esc(d.seed)}</span> · Inscritos: ${d.entryCount}</p><div class="rounds">${d.poomsaeRounds.map(r=>`<div class="r"><b>${r.name}</b><br>1. ${esc(r.poomsaes[0])}<br>2. ${esc(r.poomsaes[1])}</div>`).join('')}</div><h2>${d.system==='ORDEN'?'Orden de salida':'Bracket'}</h2>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}`;printWindow('Sorteo '+d.categoryName,html,d.system==='ELIMINATORIA')}
function printCompetition(catId){const d=state.currentDraws[catId];printWindow('Competición '+d.categoryName,`<h2>${esc(d.categoryName)}</h2>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}`,d.system==='ELIMINATORIA')}
function printResults(){const done=Object.values(state.currentDraws).filter(d=>d.result);printWindow('Resultados',done.map(d=>`<h2>${esc(d.categoryName)}</h2>${renderPodium(d)}`).join(''))}

async function refreshSharedState(){if(!serverMode)return;try{await fetchServerState();renderCurrent();document.getElementById('saveStatus').textContent='Actualizado · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});toast('Datos actualizados desde el servidor.')}catch(e){toast(e.message,true)}}
/* ===== v1.2 · múltiples competiciones, precios e inscripciones por club ===== */
function competitionBy(id){return (state.competitions||[]).find(x=>x.id===id)}
function drawKey(compId,catId){return `${compId}::${catId}`}
function getDraw(compId,catId){return state.currentDraws?.[drawKey(compId,catId)]||null}
function entriesFor(catId,competitionId=null){return state.entries.filter(e=>(!catId||e.categoryId===catId)&&(!competitionId||e.competitionId===competitionId))}
function clubCount(catId,competitionId=null){return new Set(entriesFor(catId,competitionId).map(e=>e.clubId)).size}
function registrationFee(comp,catId){if(!comp)return 0;const v=comp.categoryFees?.[catId];return Number(v!==undefined&&v!==null&&v!==''?v:comp.defaultFee||0)}
function money(v){return new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'}).format(Number(v||0))}
function dateOnly(v){if(!v)return 'Fecha por definir';const d=new Date(v+'T12:00:00');return new Intl.DateTimeFormat('es-ES',{dateStyle:'medium'}).format(d)}
function competitionEntryCount(compId){return state.entries.filter(e=>e.competitionId===compId).length}
function competitionRevenue(compId,clubId=null){return state.entries.filter(e=>e.competitionId===compId&&(!clubId||e.clubId===clubId)).reduce((a,e)=>a+Number(e.fee||0),0)}
function competitionCategories(comp){return (comp?.categoryIds||[]).map(catBy).filter(Boolean)}
function invalidateDraw(compId,catId){delete state.currentDraws[drawKey(compId,catId)]}
function invalidateCategoryDraws(catId){for(const [k,d] of Object.entries(state.currentDraws||{}))if(d.categoryId===catId&&!d.confirmed)delete state.currentDraws[k]}
function categoryHasConfirmedDraw(catId){return Object.values(state.currentDraws||{}).some(d=>d.categoryId===catId&&d.confirmed)}
function scopeHasConfirmedDraw(compId,catId){return !!getDraw(compId,catId)?.confirmed}
function selectedOrFirstCompetition(onlyOpen=false){const list=(state.competitions||[]).filter(c=>!onlyOpen||c.registrationOpen);if(selectedCompetitionId&&list.some(c=>c.id===selectedCompetitionId))return competitionBy(selectedCompetitionId);return list[0]||null}

function renderEvents(){
  const v=document.getElementById('view-events');
