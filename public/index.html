<head>

<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#17191d;--muted:#6c727f;--line:#e3e5ea;--accent:#c1121f;--accent2:#8d0d15;--ok:#087f5b;--warn:#a15c00;--danger:#b42318;--black:#111;--shadow:0 10px 30px rgba(17,24,39,.08);--radius:14px}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#111;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 24px}.brand-mark{width:40px;height:40px;border:3px solid #fff;border-radius:50%;position:relative}.brand-mark:after{content:"";position:absolute;width:18px;height:3px;background:var(--accent);left:8px;top:17px;transform:rotate(-28deg)}.brand b{font-size:16px}.brand small{display:block;color:#aaa;margin-top:3px}.nav button{width:100%;border:0;background:transparent;color:#ddd;text-align:left;padding:11px 12px;border-radius:9px;margin:2px 0}.nav button:hover,.nav button.active{background:#2a2a2a;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 var(--accent)}.main{min-width:0}.topbar{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;background:rgba(255,255,255,.93);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(10px)}.topbar h1{font-size:22px;margin:0}.topbar .status{font-size:12px;color:var(--muted)}.content{padding:26px;max-width:1600px;margin:auto}.view{display:none}.view.active{display:block}.grid{display:grid;gap:16px}.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat b{font-size:28px;display:block;margin-top:7px}.stat span{font-size:13px;color:var(--muted)}.section-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 0 16px}.section-head h2{margin:0;font-size:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:650}.btn:hover{border-color:#bbb}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.dark{background:#111;color:#fff;border-color:#111}.btn.danger{color:var(--danger);border-color:#f0c9c5;background:#fff7f6}.btn.small{padding:5px 8px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.toolbar{display:flex;gap:9px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px;min-width:150px}.field label{font-size:12px;font-weight:700;color:#565c66}.field input,.field select,.field textarea{border:1px solid #cfd3da;background:#fff;padding:9px 10px;border-radius:8px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(193,18,31,.08)}.field.grow{flex:1;min-width:220px}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid #eceef2;text-align:left;font-size:13px}th{background:#f9fafb;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#666;position:sticky;top:0}tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:800;background:#f0f1f4}.badge.red{background:#fff0f1;color:var(--accent)}.badge.green{background:#e8f7f1;color:var(--ok)}.badge.orange{background:#fff4df;color:var(--warn)}.badge.black{background:#191919;color:#fff}.muted{color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.notice{padding:12px 14px;border-radius:10px;background:#fff7e8;border:1px solid #f0d7aa;color:#7c4a00;font-size:13px}.notice.error{background:#fff2f1;border-color:#f2c6c2;color:#8e1c13}.notice.ok{background:#ebf8f3;border-color:#c1e6d6;color:#075c42}.split{display:grid;grid-template-columns:340px 1fr;gap:18px}.list-card{padding:0}.list-card button{display:block;width:100%;border:0;border-bottom:1px solid #eee;background:#fff;text-align:left;padding:12px 14px}.list-card button.active{background:#fff3f4;box-shadow:inset 3px 0 0 var(--accent)}.list-card button:last-child{border-bottom:0}.detail-title{display:flex;align-items:start;justify-content:space-between;gap:12px}.detail-title h3{margin:0}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 16px}.round-boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.round-box{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fafafa}.round-box h4{margin:0 0 8px;font-size:13px}.poomsae{font-weight:750;padding:5px 0}.seed{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f3f4f6;padding:3px 6px;border-radius:6px}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.46);display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}.modal-backdrop.open{display:flex}.modal{background:#fff;border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 25px 80px rgba(0,0,0,.25)}.modal header{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal header h3{margin:0}.modal .body{padding:20px}.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;border:1px solid var(--line);border-radius:9px;padding:10px;max-height:220px;overflow:auto}.check{display:flex;gap:7px;align-items:center;font-size:12px}.toast{position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s;z-index:2000;max-width:420px}.toast.show{opacity:1;transform:none}.toast.error{background:#8f1d14}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:transparent;padding:9px 12px;font-weight:700;color:#666;border-bottom:2px solid transparent}.tabs button.active{color:var(--accent);border-color:var(--accent)}
/* bracket */
.bracket-scroll{overflow:auto;padding:8px 0}.bracket{display:flex;gap:34px;min-width:max-content;align-items:stretch}.bracket-round{width:235px;display:flex;flex-direction:column}.bracket-round h4{text-align:center;margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:18px}.match{position:relative;border:1px solid #d5d8dd;border-radius:10px;background:#fff;box-shadow:0 4px 14px rgba(17,24,39,.06);padding:8px}.match:after{content:"";position:absolute;right:-35px;top:50%;width:35px;border-top:1px solid #c9ccd2}.bracket-round:last-child .match:after{display:none}.slot{display:flex;justify-content:space-between;gap:7px;align-items:center;padding:7px 8px;border-radius:7px;border:1px solid transparent}.slot+ .slot{margin-top:4px}.slot.winner{background:#edf8f3;border-color:#b9e3d3}.slot.bye{color:#888;background:#f5f5f5;font-style:italic}.slot .who{min-width:0}.slot .name{font-size:12px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot .club{font-size:10px;color:#777}.win-btn{border:0;background:#111;color:#fff;border-radius:6px;padding:4px 6px;font-size:10px}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.podium .place{text-align:center;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}.podium .medal{font-size:30px}.podium b{display:block;margin-top:6px}.result-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.history-json{font-size:11px;font-family:ui-monospace,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;background:#111;color:#eee;padding:12px;border-radius:8px}.danger-zone{border:1px solid #f0c9c5;background:#fff7f6}.hr{height:1px;background:var(--line);margin:16px 0}

.event-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.event-card{position:relative}.event-card .price{font-size:28px;font-weight:850;margin:8px 0}.event-card .price small{font-size:12px;color:var(--muted);font-weight:600}.category-fee-list{display:grid;gap:8px;max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px}.category-fee-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;padding:7px;border-bottom:1px solid #eee}.category-fee-row:last-child{border-bottom:0}.money{font-variant-numeric:tabular-nums;font-weight:750}.competition-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#111;color:#fff;padding:16px 18px;border-radius:14px;margin-bottom:16px}.competition-banner .muted{color:#bbb}
@media(max-width:1100px){.cards{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.app{grid-template-columns:210px 1fr}}@media(max-width:760px){.app{display:block}.sidebar{height:auto;position:relative}.nav{display:flex;overflow:auto;gap:4px}.nav button{width:auto;white-space:nowrap}.brand{padding-bottom:12px}.topbar{position:relative;padding:14px 16px}.content{padding:16px}.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.podium{grid-template-columns:1fr}}

/* authentication / roles */
.auth-screen{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(135deg,#f7f7f8 0%,#eceef1 100%)}
.auth-screen.open{display:flex}.auth-card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 25px 70px rgba(17,24,39,.14);overflow:hidden}.auth-head{background:#111;color:#fff;padding:24px}.auth-head h1{margin:0;font-size:22px}.auth-head p{margin:7px 0 0;color:#bbb;font-size:13px}.auth-accent{height:4px;background:var(--accent)}.auth-body{padding:24px}.auth-body .field{margin-bottom:12px}.auth-help{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.user-zone{display:flex;align-items:center;gap:10px}.user-chip{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.user-chip b{font-size:12px}.user-chip span{font-size:10px;color:var(--muted)}.club-hero{border-left:4px solid var(--accent)}.credential-box{background:#111;color:#fff;border-radius:10px;padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.7}.readonly-club{padding:9px 10px;border:1px solid #d8dbe1;background:#f7f8fa;border-radius:8px;font-weight:700}.security-note{font-size:12px;color:var(--muted);line-height:1.5}
@media print{.sidebar,.topbar,.no-print,.actions,.toolbar,button{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none;border:0}.view{display:block!important}.bracket-scroll{overflow:visible}.bracket{transform-origin:left top}.main{width:100%}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen"><div class="auth-card"><div class="auth-accent"></div><div class="auth-head"><h1>Poomsae Manager</h1><p id="authSubtitle">Acceso al campeonato</p></div><div class="auth-body" id="authBody"></div></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"></div><div><b>Poomsae Manager</b><small>Campeonato</small></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><h1 id="pageTitle">Dashboard</h1><div class="user-zone"><div class="user-chip" id="userChip"></div><div class="status" id="saveStatus">Guardado local</div><button class="btn small" id="refreshBtn" style="display:none" onclick="refreshSharedState()">Actualizar</button><button class="btn small" id="logoutBtn" onclick="logout()">Cerrar sesión</button></div></div>
    <div class="content">
      <section id="view-dashboard" class="view active"></section>
      <section id="view-events" class="view"></section>
      <section id="view-categories" class="view"></section>
      <section id="view-clubs" class="view"></section>
      <section id="view-competitors" class="view"></section>
      <section id="view-draws" class="view"></section>
      <section id="view-competition" class="view"></section>
      <section id="view-results" class="view"></section>
      <section id="view-history" class="view"></section>
      <section id="view-settings" class="view"></section>
    </div>
  </main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><header><h3 id="modalTitle"></h3><button class="btn small" onclick="closeModal()">✕</button></header><div class="body" id="modalBody"></div><footer id="modalFooter"></footer></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const APP_VERSION='2.0.0';
const POOMSAES={
  cadete:['Taegeuk 4 Jang','Taegeuk 5 Jang','Taegeuk 6 Jang','Taegeuk 7 Jang','Taegeuk 8 Jang','Koryo','Keumgang','Taebaek'],
  junior:['Taegeuk 5 Jang','Taegeuk 6 Jang','Taegeuk 7 Jang','Taegeuk 8 Jang','Koryo','Keumgang','Taebaek','Pyongwon'],
  senior:['Taegeuk 7 Jang','Taegeuk 8 Jang','Koryo','Keumgang','Taebaek','Pyongwon','Sipjin','Jitae','Chonkwon','Hansu','Chitae'],
  master:['Koryo','Keumgang','Taebaek','Pyongwon','Sipjin','Jitae','Chonkwon','Hansu']
};
const ALL_POOMSAES=[...new Set(Object.values(POOMSAES).flat())];
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const norm=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const deep=x=>JSON.parse(JSON.stringify(x));
const fmtDate=x=>new Intl.DateTimeFormat('es-ES',{dateStyle:'short',timeStyle:'short'}).format(new Date(x));
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

function defaultCategories(){
  const a=[]; const add=(name,type,sex,age,system='ORDEN')=>a.push({id:uid('cat'),name,type,sex,age,system,poomsaes:[...(POOMSAES[age]||[])],createdAt:Date.now()});
  add('Cadete adulto masculino','Individual','Masculino','cadete'); add('Cadete adulto femenino','Individual','Femenino','cadete');
  add('Junior masculino','Individual','Masculino','junior'); add('Junior femenino','Individual','Femenino','junior');
  add('Senior 1 masculino','Individual','Masculino','senior'); add('Senior 1 femenino','Individual','Femenino','senior');
  add('Senior 2 masculino','Individual','Masculino','senior'); add('Senior 2 femenino','Individual','Femenino','senior');
  add('Master 1 masculino','Individual','Masculino','master'); add('Master 1 femenino','Individual','Femenino','master');
  add('Master 2 masculino','Individual','Masculino','master'); add('Master 2 femenino','Individual','Femenino','master');
  add('Master 3 masculino','Individual','Masculino','master'); add('Master 3 femenino','Individual','Femenino','master');
  add('Pareja cadete','Pareja','Mixto','cadete'); add('Pareja junior','Pareja','Mixto','junior'); add('Pareja senior 1','Pareja','Mixto','senior'); add('Pareja senior 2','Pareja','Mixto','senior');
  add('Trío cadete masculino','Trío','Masculino','cadete'); add('Trío cadete femenino','Trío','Femenino','cadete'); add('Trío junior masculino','Trío','Masculino','junior'); add('Trío junior femenino','Trío','Femenino','junior');
  add('Trío senior 1 masculino','Trío','Masculino','senior'); add('Trío senior 1 femenino','Trío','Femenino','senior'); add('Trío senior 2 masculino','Trío','Masculino','senior'); add('Trío senior 2 femenino','Trío','Femenino','senior');
  return a;
}
function initialState(){return {version:APP_VERSION,categories:defaultCategories(),competitions:[],clubs:[],entries:[],currentDraws:{},history:[],settings:{eventName:'Gestión de Poomsae',thirdPlace:false},auth:{admin:null},createdAt:Date.now(),updatedAt:Date.now()}}
let state=initialState(); let currentView='dashboard'; let selectedDrawCategory=null; let selectedCompetitionId=null; let filters={};
let session=null; let serverMode=false; let serverConfigured=false; let serverRevision=null;
async function api(path,options={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data=null;try{data=await r.json()}catch(e){}if(!r.ok){const err=new Error(data?.error||('Error de servidor '+r.status));err.status=r.status;throw err}return data}
async function probeServer(){try{const r=await fetch('/api/bootstrap',{credentials:'same-origin'});if(!r.ok)return false;const d=await r.json();serverMode=true;serverConfigured=!!d.configured;session=d.session||null;return true}catch(e){serverMode=false;return false}}
async function fetchServerState(){const d=await api('/api/state');state=d.state;migrateState();session=d.session||session;serverRevision=state.updatedAt||null;return state}
function migrateState(){
  state.settings=state.settings||{eventName:'Gestión de Poomsae',thirdPlace:false};
  state.auth=state.auth||{admin:null};
  state.clubs=(state.clubs||[]).map(c=>({...c,loginUsername:c.loginUsername||'',passwordSalt:c.passwordSalt||'',passwordHash:c.passwordHash||'',active:c.active!==false}));
  state.categories=state.categories||defaultCategories();
  state.entries=state.entries||[];
  state.history=state.history||[];
  state.currentDraws=state.currentDraws||{};
  if(!Array.isArray(state.competitions)) state.competitions=[];
  let legacy=null;
  const legacyNeeded=state.entries.some(e=>!e.competitionId)||Object.values(state.currentDraws).some(d=>!d.competitionId)||state.history.some(h=>!h.competitionId);
  if(legacyNeeded){
    legacy=state.competitions[0];
    if(!legacy){
      legacy={id:'comp_legacy',name:state.settings.eventName||'Campeonato migrado',date:'',location:'',registrationOpen:true,defaultFee:0,categoryIds:state.categories.map(c=>c.id),categoryFees:{},createdAt:state.createdAt||Date.now()};
      state.competitions.push(legacy);
    }
    state.entries=state.entries.map(e=>({...e,competitionId:e.competitionId||legacy.id,fee:Number.isFinite(Number(e.fee))?Number(e.fee):0}));
    const remapped={};
    for(const [k,d0] of Object.entries(state.currentDraws)){
      const d={...d0};
      d.competitionId=d.competitionId||legacy.id;
      d.competitionName=d.competitionName||state.competitions.find(x=>x.id===d.competitionId)?.name||legacy.name;
      d.drawKey=d.drawKey||`${d.competitionId}::${d.categoryId}`;
      remapped[d.drawKey]=d;
    }
    state.currentDraws=remapped;
    state.history=state.history.map(h=>({...h,competitionId:h.competitionId||legacy.id,competitionName:h.competitionName||legacy.name,drawKey:h.drawKey||`${h.competitionId||legacy.id}::${h.categoryId}`}));
  }
  state.competitions=state.competitions.map(c=>({...c,date:c.date||'',location:c.location||'',registrationOpen:c.registrationOpen!==false,defaultFee:Number(c.defaultFee||0),categoryIds:Array.isArray(c.categoryIds)?c.categoryIds:state.categories.map(x=>x.id),categoryFees:c.categoryFees||{}}));
  state.entries=state.entries.map(e=>({...e,fee:Number(e.fee||0)}));
  state.version=APP_VERSION
}
function randomSalt(){return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}
async function hashPassword(password,salt){const data=new TextEncoder().encode(String(salt)+'|'+String(password));const buf=await crypto.subtle.digest('SHA-256',data);return Array.from(new Uint8Array(buf),b=>b.toString(16).padStart(2,'0')).join('')}
function loadSession(){try{session=JSON.parse(sessionStorage.getItem('poomsae_session')||'null')}catch(e){session=null}if(session?.role==='club'&&!clubBy(session.clubId))session=null}
function persistSession(){if(session)sessionStorage.setItem('poomsae_session',JSON.stringify(session));else sessionStorage.removeItem('poomsae_session')}
function isAdmin(){return session?.role==='admin'}
function isClub(){return session?.role==='club'}
function activeClubId(){return isClub()?session.clubId:null}
function activeClub(){return clubBy(activeClubId())}
function requireAdmin(){if(!isAdmin()){toast('Esta función está reservada a la organización.',true);return false}return true}
function requireOwnEntry(id){const e=entryBy(id);if(!e)return false;if(isAdmin())return true;if(isClub()&&e.clubId===activeClubId())return true;toast('No tienes permiso para modificar esta inscripción.',true);return false}
function generatedUsername(name){const base=norm(name).replace(/\s+/g,'.').replace(/[^a-z0-9.]/g,'').slice(0,22)||'club';let u=base,n=2;while(state.clubs.some(c=>norm(c.loginUsername)===norm(u))){u=base+n;n++}return u}
function generatedPassword(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$';const a=new Uint32Array(12);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join('')}


// IndexedDB with localStorage fallback
const DB={db:null, async init(){try{await new Promise((res,rej)=>{const r=indexedDB.open('PoomsaeChampionshipDB',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('kv'))r.result.createObjectStore('kv')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)});const saved=await this.get('state');if(saved)state=saved;else await this.set('state',state)}catch(e){const s=localStorage.getItem('poomsae_state');if(s)state=JSON.parse(s)}migrateState();await this.set('state',state)},async get(k){if(!this.db)return null;return new Promise((res,rej)=>{const t=this.db.transaction('kv','readonly').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},async set(k,v){if(this.db)return new Promise((res,rej)=>{const t=this.db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)});localStorage.setItem('poomsae_state',JSON.stringify(v))}}
let saveTimer=null; function save(){state.updatedAt=Date.now();document.getElementById('saveStatus').textContent='Guardando…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{if(serverMode){if(isAdmin()){const payload={state};if(serverRevision!==null)payload.baseUpdatedAt=serverRevision;const r=await api('/api/state',{method:'PUT',body:JSON.stringify(payload)});serverRevision=r.updatedAt;state.updatedAt=r.updatedAt}else if(isClub()){const r=await api('/api/club-entries',{method:'PUT',body:JSON.stringify({entries:state.entries.filter(e=>e.clubId===activeClubId())})});serverRevision=r.updatedAt;if(Array.isArray(r.entries))state.entries=r.entries;state.updatedAt=r.updatedAt}document.getElementById('saveStatus').textContent='Guardado compartido · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}else{await DB.set('state',state);document.getElementById('saveStatus').textContent='Guardado local · '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}}catch(e){document.getElementById('saveStatus').textContent=e.status===409?'Hay cambios nuevos':'Error al guardar';toast(e.message+(e.status===409?' Pulsa “Actualizar”.':''),true)}},150)}
function toast(msg,error=false){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show'+(error?' error':'');setTimeout(()=>t.className='toast',2600)}
function openModal(title,body,buttons){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFooter').innerHTML=buttons||'<button class="btn" onclick="closeModal()">Cerrar</button>';document.getElementById('modal').classList.add('open')}

function catBy(id){return state.categories.find(x=>x.id===id)} function clubBy(id){return state.clubs.find(x=>x.id===id)} function entryBy(id){return state.entries.find(x=>x.id===id)}
function entriesFor(catId){return state.entries.filter(e=>e.categoryId===catId)}
function clubCount(catId){return new Set(entriesFor(catId).map(e=>e.clubId)).size}

function clubName(e){return clubBy(e?.clubId)?.name||'—'}
