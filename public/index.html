function saveEntry(id){if(id&&!requireOwnEntry(id))return;const kind=document.getElementById('eKind').value,clubId=isClub()?activeClubId():document.getElementById('eClub').value,competitionId=document.getElementById('eCompetition').value,categoryId=document.getElementById('eCat').value,comp=competitionBy(competitionId),cat=catBy(categoryId);if(!clubId)return toast('Selecciona un club.',true);if(isClub()&&clubId!==activeClubId())return toast('No puedes inscribir deportistas para otro club.',true);if(!comp)return toast('Selecciona una competición.',true);if(isClub()&&!comp.registrationOpen)return toast('Las inscripciones de esta competición están cerradas.',true);if(!categoryId||!comp.categoryIds.includes(categoryId))return toast('Selecciona una categoría habilitada para esta competición.',true);if(cat?.type!==kind)return toast('La categoría no coincide con el tipo de inscripción.',true);let data={kind,clubId,competitionId,categoryId};if(kind==='Individual'){const firstName=document.getElementById('eFirst').value.trim(),lastName=document.getElementById('eLast').value.trim();if(!firstName)return toast('El participante necesita nombre.',true);data={...data,firstName,lastName,name:'',members:[]}}else{const name=document.getElementById('eName').value.trim(),count=kind==='Pareja'?2:3,members=[...Array(count)].map((_,i)=>document.getElementById('eM'+i).value.trim());if(!name)return toast('El equipo necesita nombre o identificador.',true);if(members.some(x=>!x))return toast(`${kind} incompleto: faltan competidores.`,true);data={...data,name,members,firstName:'',lastName:''}}const key=norm(kind==='Individual'?`${data.firstName} ${data.lastName}`:data.name);if(state.entries.some(x=>x.id!==id&&x.competitionId===competitionId&&x.categoryId===categoryId&&x.clubId===clubId&&norm(entryName(x))===key))return toast('Parece una inscripción duplicada en la misma competición, categoría y club.',true);const old=id?entryBy(id):null,oldKey=old?drawKey(old.competitionId,old.categoryId):null,newKey=drawKey(competitionId,categoryId);if(state.currentDraws[newKey]?.confirmed||oldKey&&state.currentDraws[oldKey]?.confirmed)return toast('El sorteo de esta categoría y competición ya está confirmado y no admite cambios.',true);const fee=old&&old.competitionId===competitionId&&old.categoryId===categoryId?Number(old.fee||0):registrationFee(comp,categoryId);data.fee=fee;if(id)Object.assign(old,data,{updatedAt:Date.now()});else state.entries.push({id:uid('entry'),...data,createdAt:Date.now(),createdBy:isClub()?'club':'admin'});delete state.currentDraws[newKey];if(oldKey&&oldKey!==newKey)delete state.currentDraws[oldKey];save();closeModal();renderCompetitors();toast(`Inscripción guardada · ${money(fee)}.`)}
function duplicateEntry(id){if(!requireOwnEntry(id))return;const src=entryBy(id),comp=competitionBy(src.competitionId);if(isClub()&&!comp?.registrationOpen)return toast('Las inscripciones de esta competición están cerradas.',true);if(scopeHasConfirmedDraw(src.competitionId,src.categoryId))return toast('El sorteo está confirmado y no admite nuevas inscripciones.',true);const e=deep(src);e.id=uid('entry');if(e.kind==='Individual')e.firstName=e.firstName+' (copia)';else e.name=e.name+' (copia)';e.fee=registrationFee(comp,e.categoryId);e.createdAt=Date.now();e.createdBy=isClub()?'club':'admin';state.entries.push(e);invalidateDraw(e.competitionId,e.categoryId);save();renderCompetitors();toast('Inscripción duplicada; edítala para evitar confusiones.')}
function deleteEntry(id){if(!requireOwnEntry(id))return;const e=entryBy(id),comp=competitionBy(e.competitionId);if(isClub()&&!comp?.registrationOpen)return toast('Las inscripciones de esta competición están cerradas.',true);if(scopeHasConfirmedDraw(e.competitionId,e.categoryId))return toast('Esta categoría ya tiene el sorteo confirmado y no admite cambios.',true);if(confirm('¿Eliminar esta inscripción?')){state.entries=state.entries.filter(x=>x.id!==id);invalidateDraw(e.competitionId,e.categoryId);save();renderCompetitors();toast('Inscripción eliminada.')}}

function makeDraw(comp,cat,manualSeed=null,forceBest=false){const es=entriesFor(cat.id,comp.id);if(!es.length)throw new Error('No hay participantes inscritos en esta categoría para esta competición.');const seed=String(manualSeed||randomSeed());const signature=[seed,comp.id,cat.id,cat.system,cat.poomsaes.join('|'),...es.map(e=>[e.id,e.clubId,entryName(e)].join(':')).sort()].join('||');const rng=seeded(signature);const poomsaeRounds=drawPoomsaes(cat,es.length,rng);let order=null,bracket=null;if(cat.system==='ORDEN')order=shuffle(es,rng).map((e,i)=>({position:i+1,entryId:e.id}));else bracket=buildBracket(es,rng,forceBest);const key=drawKey(comp.id,cat.id),draw={id:uid('draw'),drawKey:key,competitionId:comp.id,competitionName:comp.name,categoryId:cat.id,categoryName:cat.name,type:cat.type,sex:cat.sex,age:cat.age,system:cat.system,entryCount:es.length,clubCount:new Set(es.map(e=>e.clubId)).size,seed,createdAt:Date.now(),confirmed:false,poomsaesAvailable:[...cat.poomsaes],poomsaeRounds,participants:es.map(e=>({...deep(e),clubName:clubName(e)})),order,bracket,result:null,signature};state.currentDraws[key]=draw;state.history.unshift(deep(draw));save();return draw}
function confirmDraw(key){const d=state.currentDraws[key];if(!d)return;if(d.confirmed)return toast('El sorteo ya está confirmado.');if(confirm('¿Confirmar y bloquear este sorteo? Después habrá que desbloquearlo para volver a sortear.')){d.confirmed=true;d.confirmedAt=Date.now();save();renderDraws();toast('Sorteo confirmado y bloqueado.')}}
function unlockDraw(key){const d=state.currentDraws[key];if(!d?.confirmed)return;if(confirm('Al desbloquear este sorteo se permitirá generar un resultado diferente. ¿Continuar?')){d.confirmed=false;d.unlockedAt=Date.now();save();renderDraws();toast('Sorteo desbloqueado.')}}
function drawCategory(compId,catId,fromAll=false){if(!requireAdmin())return;const comp=competitionBy(compId),c=catBy(catId),key=drawKey(compId,catId),old=state.currentDraws[key];if(!comp||!c)return;if(!comp.categoryIds.includes(catId))return toast('Esta categoría no está habilitada en la competición.',true);if(old?.confirmed)return toast('Este sorteo está bloqueado. Desbloquéalo para repetirlo.',true);const es=entriesFor(catId,compId);if(!es.length)return toast('No hay inscritos en esta categoría.',true);const feas=c.system==='ELIMINATORIA'?clubFeasibility(es):{possible:true};let forceBest=false;if(!feas.possible){const club=clubBy(Object.entries(feas.counts).sort((a,b)=>b[1]-a[1])[0]?.[0]);const ok=confirm(`Con la composición actual no es posible garantizar que todos los participantes del mismo club se enfrenten únicamente en la final.\n\n${club?.name||'Un club'} tiene ${feas.max} inscripciones.\n\nAceptar: generar la distribución más separada posible.\nCancelar: no generar el sorteo.`);if(!ok)return null;forceBest=true}if(old&&!fromAll&&!confirm('Ya existe un sorteo no bloqueado. ¿Generar uno nuevo? El anterior seguirá en el historial.'))return null;const manual=fromAll?null:prompt('Seed manual (opcional). Déjala vacía para generar una automáticamente:','');try{const d=makeDraw(comp,c,manual||null,forceBest);selectedCompetitionId=compId;selectedDrawCategory=catId;renderDraws();toast('Sorteo generado.');return d}catch(e){toast(e.message,true);return null}}
function drawAll(compId=selectedCompetitionId){if(!requireAdmin())return;const comp=competitionBy(compId);if(!comp)return toast('Selecciona una competición.',true);const cats=competitionCategories(comp).filter(c=>entriesFor(c.id,comp.id).length);if(!cats.length)return toast('No hay categorías con inscritos en esta competición.',true);if(!confirm(`Se sortearán ${cats.length} categorías con inscritos de “${comp.name}”. Se respetarán los sorteos confirmados. ¿Continuar?`))return;let ok=0,skipped=0;for(const c of cats){const key=drawKey(comp.id,c.id);if(state.currentDraws[key]?.confirmed){skipped++;continue}const es=entriesFor(c.id,comp.id),feas=c.system==='ELIMINATORIA'?clubFeasibility(es):{possible:true};let forceBest=false;if(!feas.possible){const proceed=confirm(`${c.name}: la separación por clubes hasta la final es matemáticamente imposible.\n\nAceptar: generar la mejor distribución posible.\nCancelar: omitir esta categoría.`);if(!proceed){skipped++;continue}forceBest=true}try{makeDraw(comp,c,null,forceBest);ok++}catch(e){skipped++}}renderDraws();toast(`Sorteo masivo terminado: ${ok} generados, ${skipped} omitidos/bloqueados.`)}
function renderDraws(){if(!requireAdmin())return;if(!state.competitions.length){document.getElementById('view-draws').innerHTML='<div class="card empty">Crea primero una competición.</div>';return}if(!selectedCompetitionId||!competitionBy(selectedCompetitionId))selectedCompetitionId=state.competitions.find(c=>competitionEntryCount(c.id))?.id||state.competitions[0].id;const comp=competitionBy(selectedCompetitionId),cats=competitionCategories(comp);if(!selectedDrawCategory||!cats.some(c=>c.id===selectedDrawCategory))selectedDrawCategory=cats.find(c=>entriesFor(c.id,comp.id).length)?.id||cats[0]?.id;const c=catBy(selectedDrawCategory),d=c?getDraw(comp.id,c.id):null;document.getElementById('view-draws').innerHTML=`<div class="section-head"><h2>Sorteos</h2><div class="actions"><button class="btn dark" onclick="drawAll('${comp.id}')">🎲 Sortear todas las categorías de esta competición</button></div></div><div class="competition-banner"><div><b>${esc(comp.name)}</b><div class="muted">${dateOnly(comp.date)}${comp.location?' · '+esc(comp.location):''}</div></div><select onchange="selectedCompetitionId=this.value;selectedDrawCategory=null;renderDraws()">${state.competitions.map(x=>`<option value="${x.id}" ${x.id===comp.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="split"><div class="card list-card">${cats.map(x=>{const n=entriesFor(x.id,comp.id).length,dd=getDraw(comp.id,x.id);return `<button class="${x.id===selectedDrawCategory?'active':''}" onclick="selectedDrawCategory='${x.id}';renderDraws()"><b>${esc(x.name)}</b><br><span class="muted">${n} inscritos · ${dd?(dd.confirmed?'🔒 confirmado':'sorteado'):'pendiente'}</span></button>`}).join('')||'<div class="empty">No hay categorías habilitadas.</div>'}</div><div>${c?drawDetail(comp,c,d):'<div class="card empty">No hay categorías.</div>'}</div></div>`}
function drawDetail(comp,c,d){const es=entriesFor(c.id,comp.id);return `<div class="card"><div class="detail-title"><div><h3>${esc(c.name)}</h3><div class="meta"><span class="badge">${c.type}</span><span class="badge">${c.sex}</span><span class="badge ${c.system==='ELIMINATORIA'?'red':'black'}">${c.system}</span><span class="badge">${es.length} inscritos</span><span class="badge">${clubCount(c.id,comp.id)} clubes</span><span class="badge">${money(registrationFee(comp,c.id))}/inscripción</span></div></div><div class="actions"><button class="btn primary" ${d?.confirmed?'disabled':''} onclick="drawCategory('${comp.id}','${c.id}')">🎲 ${d?'Repetir sorteo':'Realizar sorteo'}</button>${d?`<button class="btn" onclick="printDraw('${d.drawKey}')">Imprimir</button>`:''}</div></div><div class="notice">Rango: ${c.poomsaes.map(esc).join(' · ')}<br>Rondas de poomsae automáticas: <b>${poomsaeRoundNames(es.length||1).join(' → ')}</b></div>${d?renderDrawResult(d):'<div class="empty">Aún no se ha realizado el sorteo.</div>'}</div>`}
function renderDrawResult(d){let validation='';if(d.system==='ELIMINATORIA'){if(d.bracket.validation.valid)validation='<div class="notice ok">✓ La distribución mantiene separados a los miembros del mismo club hasta la final.</div>';else validation=`<div class="notice error"><b>Separación total imposible.</b> Esta es la distribución más separada encontrada.<br>${d.bracket.validation.violations.map(v=>{const a=d.participants.find(x=>x.id===v.a),b=d.participants.find(x=>x.id===v.b);return `${esc(entryName(a))} y ${esc(entryName(b))} (${esc(a?.clubName||'')}) podrían coincidir en <b>${v.roundName}</b>.`}).join('<br>')}</div>`}return `<div class="meta"><span>${esc(d.competitionName)}</span><span>Seed <span class="seed">${esc(d.seed)}</span></span><span>${fmtDate(d.createdAt)}</span><span>ID <span class="seed">${d.id}</span></span>${d.confirmed?'<span class="badge green">🔒 Confirmado</span>':'<span class="badge orange">No confirmado</span>'}</div><div class="round-boxes">${d.poomsaeRounds.map(r=>`<div class="round-box"><h4>${r.name}</h4><div class="poomsae">1. ${esc(r.poomsaes[0])}</div><div class="poomsae">2. ${esc(r.poomsaes[1])}</div></div>`).join('')}</div><div class="hr"></div>${validation}<h3>${d.system==='ORDEN'?'Orden de salida':'Cuadro de competición'}</h3>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}<div class="actions" style="margin-top:16px">${d.confirmed?`<button class="btn danger" onclick="unlockDraw('${d.drawKey}')">Desbloquear sorteo</button>`:`<button class="btn dark" onclick="confirmDraw('${d.drawKey}')">🔒 Confirmar sorteo</button>`}</div>`}
function renderBracket(d,interactive=true){const b=d.bracket;return `<div class="bracket-scroll"><div class="bracket">${b.rounds.map((r,ri)=>`<div class="bracket-round"><h4>${r.name}</h4><div class="matches">${r.matches.map((m,mi)=>`<div class="match">${renderSlot(d,m,m.p1,ri,mi,interactive,1)}${renderSlot(d,m,m.p2,ri,mi,interactive,2)}${interactive&&m.winnerId&&!((m.p1&&!m.p2)||(!m.p1&&m.p2))?`<div style="text-align:right;margin-top:5px"><button class="btn small" onclick="undoWinner('${d.drawKey}',${ri},${mi})">Deshacer resultado</button></div>`:''}</div>`).join('')}</div></div>`).join('')}</div></div>`}
function renderSlot(d,m,id,ri,mi,interactive,side){if(!id){const hasPotential=slotCanStillProduce(d.bracket,m,side,ri),label=ri===0||!hasPotential?'BYE':'PENDIENTE';return `<div class="slot ${label==='BYE'?'bye':''}"><div class="who"><div class="name">${label}</div></div></div>`}const e=d.participants.find(x=>x.id===id),win=m.winnerId===id;return `<div class="slot ${win?'winner':''}"><div class="who"><div class="name">${esc(entryName(e))}</div><div class="club">${esc(e?.clubName||'')}</div></div>${interactive&&m.p1&&m.p2&&!m.winnerId?`<button class="win-btn" onclick="selectWinner('${d.drawKey}',${ri},${mi},'${id}')">Ganador</button>`:(win?'✓':'')}</div>`}
function selectWinner(key,ri,mi,winnerId){const d=state.currentDraws[key];if(!d||d.system!=='ELIMINATORIA')return;const m=d.bracket.rounds[ri].matches[mi];if(![m.p1,m.p2].includes(winnerId))return;m.winnerId=winnerId;clearDownstream(d.bracket,ri,mi);setNextSlot(d.bracket,ri,mi,winnerId);autoAdvanceByes(d.bracket);d.updatedAt=Date.now();computeBracketResult(d);save();renderCompetition()}
function undoWinner(key,ri,mi){const d=state.currentDraws[key],m=d?.bracket?.rounds?.[ri]?.matches?.[mi];if(!m?.winnerId)return;m.winnerId=null;clearDownstream(d.bracket,ri,mi);d.result=null;save();renderCompetition()}

function renderCompetition(){if(!requireAdmin())return;const comps=state.competitions.filter(c=>Object.values(state.currentDraws).some(d=>d.competitionId===c.id&&d.confirmed));if(!filters.liveComp||!comps.some(c=>c.id===filters.liveComp))filters.liveComp=comps[0]?.id||'';const draws=Object.values(state.currentDraws).filter(d=>d.confirmed&&d.competitionId===filters.liveComp);if(!filters.liveDrawKey||!state.currentDraws[filters.liveDrawKey]?.confirmed||state.currentDraws[filters.liveDrawKey]?.competitionId!==filters.liveComp)filters.liveDrawKey=draws[0]?.drawKey||'';const d=state.currentDraws[filters.liveDrawKey];document.getElementById('view-competition').innerHTML=`<div class="section-head"><h2>Competición</h2></div><div class="toolbar"><div class="field"><label>Campeonato</label><select onchange="filters.liveComp=this.value;filters.liveDrawKey='';renderCompetition()"><option value="">Seleccionar…</option>${comps.map(c=>`<option value="${c.id}" ${filters.liveComp===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field grow"><label>Categoría con sorteo confirmado</label><select onchange="filters.liveDrawKey=this.value;renderCompetition()"><option value="">Seleccionar…</option>${draws.map(x=>`<option value="${x.drawKey}" ${filters.liveDrawKey===x.drawKey?'selected':''}>${esc(x.categoryName)}</option>`).join('')}</select></div></div>${!d?'<div class="card empty">Confirma un sorteo para gestionar la competición.</div>':`<div class="card"><div class="detail-title"><div><h3>${esc(d.categoryName)}</h3><div class="meta"><span>${esc(d.competitionName)}</span><span class="badge ${d.system==='ELIMINATORIA'?'red':'black'}">${d.system}</span><span class="seed">${esc(d.seed)}</span></div></div><button class="btn" onclick="printCompetition('${d.drawKey}')">Imprimir</button></div>${d.system==='ELIMINATORIA'?renderBracket(d,true):renderOrderCompetition(d)}</div>`}`}
function renderOrderCompetition(d){const choices=d.participants.map(e=>`<option value="${e.id}">${esc(entryName(e))} — ${esc(e.clubName)}</option>`).join('');return `<div class="notice">Registra la clasificación final una vez obtenidas las notas oficiales.</div>${renderOrder(d)}<div class="hr"></div><div class="form-grid"><div class="field"><label>🥇 Campeón</label><select id="ordGold"><option value="">—</option>${choices}</select></div><div class="field"><label>🥈 Subcampeón</label><select id="ordSilver"><option value="">—</option>${choices}</select></div>${state.settings.thirdPlace?`<div class="field"><label>🥉 Tercer puesto</label><select id="ordBronze"><option value="">—</option>${choices}</select></div>`:''}</div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveOrderResult('${d.drawKey}')">Guardar resultado</button></div>${d.result?renderPodium(d):''}`}
function saveOrderResult(key){const d=state.currentDraws[key],g=document.getElementById('ordGold').value,s=document.getElementById('ordSilver').value,b=state.settings.thirdPlace?document.getElementById('ordBronze').value:null;if(!g||!s||g===s)return toast('Selecciona campeón y subcampeón distintos.',true);if(b&&[g,s].includes(b))return toast('El tercer puesto debe ser distinto.',true);d.result={championId:g,runnerUpId:s,thirdId:b||null,completedAt:Date.now()};save();renderCompetition();toast('Resultado guardado.')}
function chooseThird(key,id){const d=state.currentDraws[key];if(!d?.result)return;d.result.thirdId=id||null;save();renderCompetition()}
function renderThirdSelector(d){const semi=d.bracket.rounds.at(-2);if(!semi)return'';const losers=[];semi.matches.forEach(m=>{if(m.winnerId&&m.p1&&m.p2)losers.push(m.winnerId===m.p1?m.p2:m.p1)});return `<div class="field" style="margin-top:12px"><label>Seleccionar tercer puesto entre semifinalistas derrotados</label><select onchange="chooseThird('${d.drawKey}',this.value)"><option value="">—</option>${losers.map(id=>{const e=d.participants.find(x=>x.id===id);return `<option value="${id}">${esc(entryName(e))}</option>`}).join('')}</select></div>`}
function renderResults(){if(!requireAdmin())return;const done=Object.values(state.currentDraws).filter(d=>d.result).sort((a,b)=>(a.competitionName||'').localeCompare(b.competitionName||'')||(a.categoryName||'').localeCompare(b.categoryName||''));document.getElementById('view-results').innerHTML=`<div class="section-head"><h2>Resultados</h2><button class="btn" onclick="printResults()">Imprimir resultados</button></div>${done.length?done.map(d=>`<div class="card" style="margin-bottom:14px"><div class="detail-title"><div><h3>${esc(d.categoryName)}</h3><div class="meta"><span class="badge black">${esc(d.competitionName)}</span><span class="badge">${d.system}</span><span>${fmtDate(d.result.completedAt)}</span></div></div></div>${renderPodium(d)}${d.system==='ELIMINATORIA'&&state.settings.thirdPlace&&!d.result.thirdId?renderThirdSelector(d):''}</div>`).join(''):'<div class="card empty">Todavía no hay categorías finalizadas.</div>'}`}
function renderHistory(){if(!requireAdmin())return;document.getElementById('view-history').innerHTML=`<div class="section-head"><h2>Historial de sorteos</h2><span class="muted">Copias inmutables creadas en el momento del sorteo</span></div>${state.history.length?`<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Competición</th><th>Categoría</th><th>Sistema</th><th>Seed</th><th>Inscritos</th><th>Validación</th><th></th></tr></thead><tbody>${state.history.map((h,i)=>`<tr><td>${fmtDate(h.createdAt)}</td><td>${esc(h.competitionName||'—')}</td><td>${esc(h.categoryName)}</td><td>${h.system}</td><td><span class="seed">${esc(h.seed)}</span></td><td>${h.entryCount}</td><td>${h.system==='ORDEN'?'N/A':h.bracket.validation.valid?'<span class="badge green">Válida</span>':'<span class="badge orange">Mejor posible</span>'}</td><td><button class="btn small" onclick="showHistory(${i})">Ver copia</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="card empty">No hay sorteos históricos.</div>'}`}
function showHistory(i){const h=state.history[i];openModal('Sorteo histórico · '+h.categoryName,`<div class="meta"><span class="badge black">${esc(h.competitionName||'')}</span><span>ID <span class="seed">${h.id}</span></span><span>Seed <span class="seed">${esc(h.seed)}</span></span><span>${fmtDate(h.createdAt)}</span></div><div class="round-boxes">${h.poomsaeRounds.map(r=>`<div class="round-box"><h4>${r.name}</h4><div>${esc(r.poomsaes.join(' · '))}</div></div>`).join('')}</div><div class="hr"></div>${h.system==='ORDEN'?renderOrder(h):renderBracket(h,false)}`,`<button class="btn" onclick="closeModal()">Cerrar</button>`)}

function resetChampionship(){if(!requireAdmin())return;const keepCats=confirm('¿Quieres CONSERVAR el catálogo de categorías?\nAceptar = conservar. Cancelar = restaurar las 26 categorías iniciales.');const keepClubs=confirm('¿Quieres CONSERVAR los clubes y sus credenciales?');const keepCompetitions=confirm('¿Quieres CONSERVAR las competiciones creadas?\nSi las conservas, se vaciarán sus inscripciones, sorteos y resultados.');if(!confirm('ÚLTIMA CONFIRMACIÓN: se borrarán inscripciones, sorteos, resultados e historial de competición. ¿Continuar?'))return;const cats=keepCats?state.categories:defaultCategories(),clubs=keepClubs?state.clubs:[],competitions=keepCompetitions?state.competitions.map(c=>({...c,categoryIds:c.categoryIds.filter(id=>cats.some(x=>x.id===id))})):[],auth=deep(state.auth),settings=deep(state.settings);state=initialState();state.categories=cats;state.clubs=clubs;state.competitions=competitions;state.auth=auth;state.settings=settings;save();renderSettings();toast('Datos de competición reiniciados.')}

function printDraw(key){const d=state.currentDraws[key];if(!d)return;const html=`<h2>${esc(d.competitionName)} · ${esc(d.categoryName)} · ${d.system}</h2><p>Fecha: ${fmtDate(d.createdAt)} · Seed: <span class="seed">${esc(d.seed)}</span> · Inscritos: ${d.entryCount}</p><div class="rounds">${d.poomsaeRounds.map(r=>`<div class="r"><b>${r.name}</b><br>1. ${esc(r.poomsaes[0])}<br>2. ${esc(r.poomsaes[1])}</div>`).join('')}</div><h2>${d.system==='ORDEN'?'Orden de salida':'Bracket'}</h2>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}`;printWindow('Sorteo '+d.competitionName+' '+d.categoryName,html,d.system==='ELIMINATORIA')}
function printCompetition(key){const d=state.currentDraws[key];if(!d)return;printWindow('Competición '+d.competitionName+' '+d.categoryName,`<h2>${esc(d.competitionName)} · ${esc(d.categoryName)}</h2>${d.system==='ORDEN'?renderOrder(d):renderBracket(d,false)}`,d.system==='ELIMINATORIA')}
function printResults(){const done=Object.values(state.currentDraws).filter(d=>d.result);printWindow('Resultados',done.map(d=>`<h2>${esc(d.competitionName)} · ${esc(d.categoryName)}</h2>${renderPodium(d)}`).join(''))}

(async function(){const shared=await probeServer();if(shared){if(!serverConfigured){state=initialState();renderAuth();return}if(session){try{await fetchServerState();enterApp()}catch(e){session=null;renderAuth()}}else renderAuth();return}await DB.init();loadSession();if(!state.auth?.admin?.passwordHash){session=null;persistSession();renderAuth();return}if(session){enterApp()}else renderAuth()})();
</script>
</body>
</html>
